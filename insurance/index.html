<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2E6B4F"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="보험관리"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"><link rel="apple-touch-icon" sizes="180x180" href="icon-180.png"><style>[hidden]{display:none!important}body{margin:0;background:#F3F4F6}</style></head><body>
<title>우리 가족 보험관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* 레이아웃: MY 미니앱 기본 체계 v1 — 폭 560 한 줄, 상단 고정 바(제목·가±), 카드 목록, 하단 고정 탭 4개 (한눈에·보험·청구·가족) */
:root{
  --bg:#F3F4F6; --surface:#FFFFFF; --ink:#18202C; --muted:#5E6878; --line:#DCE0E6;
  --accent:#2E6B4F; --accent-soft:#E4F0E9; --ok:#2E7D4F; --warn:#9A6400; --warn-soft:#FFF4DC; --bad:#A23B2A; --bad-soft:#FBE9E5;
  --display:"Gowun Batang",Georgia,serif;
  --body:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111419; --surface:#1A1F27; --ink:#E8EBF0; --muted:#9BA4B3; --line:#2B313C;
  --accent:#86C9A5; --accent-soft:#1F3229; --ok:#6FCB94; --warn:#E8B95A; --warn-soft:#3A2F17; --bad:#F0A08F; --bad-soft:#3A221D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111419; --surface:#1A1F27; --ink:#E8EBF0; --muted:#9BA4B3; --line:#2B313C;
  --accent:#86C9A5; --accent-soft:#1F3229; --ok:#6FCB94; --warn:#E8B95A; --warn-soft:#3A2F17; --bad:#F0A08F; --bad-soft:#3A221D; color-scheme:dark}
html,body{background:var(--bg)}
body{color:var(--ink);font:16px/1.6 var(--body);padding-inline:16px;padding-block:0 96px;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4,p{margin:0}

/* 상단 고정 바 */
.topbar{position:sticky;top:0;z-index:7;margin-inline:-16px;padding:8px 16px;padding-top:calc(8px + env(safe-area-inset-top,0px));background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;min-height:44px}
.tb-title{flex:1;min-width:0;font:700 17px/1.3 var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:14px;font-weight:500;background:var(--accent-soft);color:var(--accent);white-space:nowrap;font-variant-numeric:tabular-nums}
.save{flex:none;width:24px;height:38px;border:0;background:none;padding:0;display:grid;place-items:center;font-size:0;cursor:pointer}
.save::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--muted)}
.save[data-s="ok"]::before{background:var(--ok)}.save[data-s="local"]::before{background:var(--warn)}
.tb-font{flex:none;width:44px;height:38px;border:1px solid var(--line);background:var(--surface);border-radius:10px;font-weight:700;font-size:16px;cursor:pointer}
.tb-font small{font-size:11px}
.tb-home{flex:none;display:grid;place-items:center;width:44px;height:38px;border:1px solid var(--line);background:var(--surface);border-radius:10px;font-weight:700;font-size:14px;text-decoration:none;color:var(--accent)}
.tb-home[hidden]{display:none}
html[data-fs]:not([data-fs="m"]) .tb-font{background:var(--accent);color:var(--surface);border-color:var(--accent)}
html[data-fs="s"] .wrap>main,html[data-fs="s"] .sheet{zoom:.88}
html[data-fs="l"] .wrap>main,html[data-fs="l"] .sheet{zoom:1.14}
html[data-fs="xl"] .wrap>main,html[data-fs="xl"] .sheet{zoom:1.28}
.fpop{position:absolute;right:12px;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.18);padding:8px;display:flex;flex-direction:column;gap:4px;min-width:160px;z-index:8}
.fpop[hidden]{display:none}
.fpop p{margin:2px 6px 4px;font-size:13px;color:var(--muted)}
.fpop button{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:44px;padding:0 12px;border:1px solid transparent;border-radius:8px;background:transparent;cursor:pointer;text-align:left}
.fpop button small{color:var(--muted);font-size:13px}
.fpop button[aria-checked="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}

/* 머리 */
.dayhead{margin-block:16px 0}
.dayhead h2{font:700 21px/1.3 var(--display);text-wrap:balance}
.dayhead .meta{color:var(--muted);font-size:14px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-block:12px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.tl-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:20px 0 0}
.tl-h h3{font-size:15px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.tl-h span{font-size:13.5px;color:var(--muted)}

/* 요약 */
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px}
.kpi .big{font:600 28px/1.25 var(--body);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .big small{font-size:16px;font-weight:500;color:var(--muted);margin-left:2px}
.kpi .sub{font-size:14px;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.bar{display:grid;grid-template-columns:64px 1fr auto;gap:8px;align-items:center;font-size:14px}
.bar .trk{height:10px;border-radius:99px;background:var(--bg);overflow:hidden}
.bar .fil{height:100%;border-radius:99px;background:var(--accent)}
.bar b{font-weight:600;font-variant-numeric:tabular-nums}

/* 카드 목록 */
.list{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.card{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;color:inherit;min-width:0;width:100%;text-align:left;font:inherit;cursor:pointer}
.card:active{background:var(--accent-soft)}
.card.off{opacity:.62}
.mono{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff;font:700 18px/1 var(--display);flex:none}
.mono.sm{width:32px;height:32px;border-radius:9px;font-size:14px}
.card .nm{font-weight:600;font-size:17.5px;line-height:1.35;overflow-wrap:anywhere}
.card .ds{font-size:14px;color:var(--muted);line-height:1.5}
.card .mt{font-size:13px;color:var(--muted);margin-top:4px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.card .amt{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.card .amt small{display:block;font-weight:400;font-size:13px;color:var(--muted)}
.pinfo{grid-column:1/-1;display:flex;flex-direction:column;gap:3px;border-top:1px dashed var(--line);padding-top:8px;font-size:14px;line-height:1.45}
.pi{display:grid;grid-template-columns:64px 1fr;gap:8px}
.pi .k{color:var(--muted);font-size:13px;padding-top:1px}
.pi .v{min-width:0;overflow-wrap:anywhere}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tagx{border-radius:4px;padding:0 6px;font-weight:600;font-size:12.5px;background:var(--bg);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tagx.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.tagx.ok{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.tagx.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.empty{margin-top:12px;padding:24px 14px;text-align:center;color:var(--muted);font-size:15px;background:var(--surface);border:1px dashed var(--line);border-radius:12px}
.empty .btn{margin-top:10px}

/* 상자 */
section.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px}
section.box h3{margin:0 0 8px;font-size:15px;letter-spacing:.04em;color:var(--muted);font-weight:600}
.row{display:flex;justify-content:space-between;gap:10px;padding-block:8px;border-top:1px solid var(--line);align-items:baseline}
.row:first-of-type{border-top:0}
.row .l{min-width:0}
.row .l small{display:block;color:var(--muted);font-size:13px}
.row .r{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.ol li::marker{color:var(--accent);font-weight:600}
.note{margin-top:8px;font-size:14px;padding:8px 10px;border-radius:8px}
.note.tip{background:var(--accent-soft)}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.meta2{font-size:13.5px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-height:40px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:600}
.btn.line{background:var(--surface);border-color:var(--accent);color:var(--accent);font-weight:600}
.btn.sm{min-height:34px;padding:4px 10px;font-size:13.5px}
.btn:disabled{opacity:.5;cursor:default}
.pick{position:relative;overflow:hidden}
.pick input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px}
.pick.busy{opacity:.5;pointer-events:none}
.btn.danger{background:var(--surface);border-color:var(--bad);color:var(--bad);font-weight:600}
.sact.three{grid-template-columns:1fr 1fr 2fr}
.toast .undo{margin-left:10px;min-height:34px;padding:2px 12px;border-radius:8px;border:1px solid var(--surface);background:transparent;color:var(--surface);font-weight:600;cursor:pointer}
.frow{display:flex;flex-wrap:wrap;gap:8px}
.frow>.fld{flex:1 1 140px}
.vstack{display:flex;flex-direction:column;gap:10px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.fld input,.fld select,.fld textarea{font-size:16px;padding:8px 10px;min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%;box-sizing:border-box}
.fld textarea{min-height:72px;resize:vertical}
.fld .ck{display:flex;align-items:center;gap:8px;min-height:44px;font-size:16px;color:var(--ink)}
.fld .ck input{width:22px;height:22px;min-height:0}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:40px;height:40px;border-radius:10px;border:2px solid transparent;cursor:pointer}
.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--surface) inset}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{min-height:40px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 보장 표 */
.mx{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.mxw{overflow-x:auto;margin-inline:-14px;padding-inline:14px}
.mx th,.mx td{padding:7px 6px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
.mx th:first-child,.mx td:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
.mx thead th{border-top:0;color:var(--muted);font-weight:600;font-size:13px}
.mx td.no{color:var(--bad);font-weight:600}
.mx td.yes{font-weight:600}

/* 일정 */
.ev{display:grid;grid-template-columns:58px 1fr;gap:10px;padding-block:9px;border-top:1px solid var(--line);align-items:center}
.ev:first-child{border-top:0}
.ev .dd{text-align:center;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:14px;padding:4px 0;font-variant-numeric:tabular-nums}
.ev .dd.soon{background:var(--warn-soft);color:var(--warn)}
.ev b{font-weight:600;font-size:15px;display:block}
.ev small{font-size:13px;color:var(--muted)}

/* 보험 분석 */
.rvrow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;width:100%;min-height:48px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font:inherit;text-align:left;cursor:pointer;font-variant-numeric:tabular-nums}
.rvrow[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.rvrow b{font-weight:600;font-size:17px}
.rvrow small{display:block;font-size:13px;color:var(--muted)}
.up{color:var(--ok);font-size:13px;font-weight:600}.down{color:var(--bad);font-size:13px;font-weight:600}
.score{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.score .big{font:600 34px/1.1 var(--body);font-variant-numeric:tabular-nums}
.score .big small{font-size:16px;color:var(--muted);font-weight:500}
.gl{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:10px;font-size:15px}
.gl li::marker{color:var(--accent);font-weight:700}
.gl b{display:block;font-weight:600}
.ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:15px}
/* 보장 입력 줄 */
.cov{border:1px solid var(--line);border-radius:10px;padding:8px;display:grid;grid-template-columns:1fr 112px 40px;gap:6px;background:var(--surface)}
.cov .full{grid-column:1/-1}
.cov select,.cov input{font-size:16px;padding:6px 8px;min-height:42px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%;box-sizing:border-box;min-width:0}
.cov .x{width:40px;height:42px;border-radius:8px}
.files{display:flex;flex-direction:column;gap:6px}
.fvpage{width:100%;height:auto;display:block;background:#fff;border:1px solid var(--line);border-radius:8px}
.file{display:flex;align-items:center;gap:8px;justify-content:space-between;border:1px solid var(--line);border-radius:8px;padding:6px 8px 6px 12px;background:var(--surface);font-size:14px}
.file a{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1;min-height:34px;display:flex;align-items:center}

/* 하단 탭 */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
nav.tabs button{border:0;background:transparent;border-radius:10px;min-height:50px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12.5px;color:var(--muted);cursor:pointer}
nav.tabs button b{font-size:16px;font-weight:600;color:var(--ink)}
nav.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
nav.tabs button[aria-selected="true"] b{color:var(--accent)}

/* 아래에서 올라오는 창 */
.sheetBg{position:fixed;inset:0;z-index:20;background:rgba(10,14,20,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;background:var(--bg);border-radius:16px 16px 0 0;padding:0 16px}
.shead{position:sticky;top:0;z-index:2;margin-inline:-16px;padding:8px 16px 12px;background:var(--bg);border-bottom:1px solid var(--line)}
.grab{width:40px;height:5px;margin:0 auto 8px;border-radius:99px;background:var(--line)}
.shead .hd{display:flex;justify-content:space-between;align-items:center;gap:10px}
.shead h2{font:700 21px/1.3 var(--display);min-width:0;overflow-wrap:anywhere}
.x{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:16px;cursor:pointer}
.sact{position:sticky;bottom:0;z-index:2;margin-inline:-16px;margin-top:12px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 2fr;gap:8px}
.sact .btn{min-height:46px;font-size:15px}
.toast{position:fixed;left:50%;bottom:calc(74px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;max-width:calc(100vw - 32px);padding:10px 16px;border-radius:10px;background:var(--ink);color:var(--surface);font-size:14px;font-weight:500;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <div class="topbar">
    <a class="tb-home" id="homeBtn" href="../" hidden aria-label="MY 미니앱 허브로">MY</a>
    <div class="tb-title">우리 가족 보험관리</div>
    <span class="pill" id="tbPill">보험 0건</span>
    <button class="save" type="button" id="saveState" data-s="local" aria-label="저장 상태">저장 상태</button>
    <button class="tb-font" id="fontBtn" type="button" aria-haspopup="true" aria-expanded="false" aria-label="글자 크기">가<small>±</small></button>
    <div class="fpop" id="fontPop" hidden role="menu"><p>글자 크기</p>
      <button type="button" role="menuitemradio" data-fs="s"><span style="font-size:13px">작게</span><small>88%</small></button>
      <button type="button" role="menuitemradio" data-fs="m"><span style="font-size:15px">보통</span><small>100%</small></button>
      <button type="button" role="menuitemradio" data-fs="l"><span style="font-size:17px">크게</span><small>114%</small></button>
      <button type="button" role="menuitemradio" data-fs="xl"><span style="font-size:19px">아주 크게</span><small>128%</small></button></div>
  </div>

  <main id="vHome"></main>
  <main id="vPol" hidden></main>
  <main id="vClaim" hidden></main>
  <main id="vFam" hidden></main>
</div>

<nav class="tabs" aria-label="화면 전환"><div class="in" role="tablist">
  <button type="button" role="tab" data-view="home" aria-selected="true"><b>한눈에</b><span>보험료·일정</span></button>
  <button type="button" role="tab" data-view="pol" aria-selected="false"><b>보험</b><span id="tPol">0건</span></button>
  <button type="button" role="tab" data-view="claim" aria-selected="false"><b>청구</b><span>보험금 기록</span></button>
  <button type="button" role="tab" data-view="fam" aria-selected="false"><b>가족</b><span>구성원·백업</span></button>
</div></nav>

<div class="sheetBg" id="sheetBg" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="편집"></div></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function(){
"use strict";
/* ── 고정 목록 (값은 저장 데이터에 들어가므로 바꾸지 말 것: 이름 변경은 라벨만) ── */
const RELS=["본인","배우자","자녀","부모","형제","기타"];
const TYPES=["실손","건강(종합)","암","종신","정기","어린이","운전자","치아","간병·치매","연금","저축","화재·주택","자동차","기타"];
const STATUS={keep:"유지",paid:"납입완료",lapse:"해지",end:"만기"};
const PAYM=["자동이체","카드","급여공제","직접납부"];
const COV=[["sil","실손의료비"],["cancer","암 진단"],["brain","뇌혈관 진단"],["heart","심장 진단"],["death","사망"],["disab","후유장해"],["hosp","입원 일당"],["surg","수술비"],["drive","운전자"],["dent","치아"],["care","간병·치매"],["etc","기타"]];
const COVN=Object.fromEntries(COV);
const MX=["sil","cancer","brain","heart","death","disab","surg","care"];
const CST={ready:"준비 중",sent:"청구함",paid:"지급 완료",deny:"거절"};
const COLORS=["#2E6B4F","#24456E","#7A1F2B","#9A6400","#6B4A8E","#1D5E54","#5E6878"];

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{const n=Number(String(v??"").replace(/[^\d.-]/g,""));return isFinite(n)?n:0};
const won=n=>Math.round(n||0).toLocaleString("ko-KR")+"원";
const man=n=>{n=Math.round(n||0);if(!n)return"-";const e=Math.floor(n/10000),r=n%10000;return (e?e+"억":"")+(e&&r?" ":"")+(r?r.toLocaleString("ko-KR")+"만":"")};
const pd=s=>{if(!s)return null;const d=new Date(s+"T00:00:00");return isNaN(d)?null:d};
const today0=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const dshort=s=>{const d=pd(s);return d?`${String(d.getFullYear()).slice(2)}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")}`:""};
const days=(a,b)=>Math.round((b-a)/864e5);
const addM=(d,m)=>{const x=new Date(d);const day=x.getDate();x.setDate(1);x.setMonth(x.getMonth()+m);x.setDate(Math.min(day,new Date(x.getFullYear(),x.getMonth()+1,0).getDate()));return x};
const newId=p=>p+"_"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ── 저장: 공유 저장소(내 전용 칸) + 이 기기, 최근 고친 쪽 우선, 지움은 표시만 ── */
const LSK="myapps-insurance-v1";
const state={recs:{},view:"home",mem:null,edit:null,cmem:null};
let db=null,col=null,canWrite=true;
const ts=r=>(r&&r.updatedAt)||0;
function take(r){if(!r||!r.id||!r.kind)return false;const c=state.recs[r.id];if(!c||ts(r)>ts(c)){state.recs[r.id]={...r};return true}return false}
function lsSave(){try{localStorage.setItem(LSK,JSON.stringify({v:1,recs:state.recs}))}catch(e){}}
function lsLoad(){try{const o=JSON.parse(localStorage.getItem(LSK)||"null");if(o&&o.recs)Object.values(o.recs).forEach(take)}catch(e){}}
const q=[];let busy=false;
function push(id){if(!col||!canWrite)return;const r=state.recs[id];if(!r)return;q.push(()=>col.doc(id).set(JSON.parse(JSON.stringify(r))));if(!busy)run()}
async function run(){busy=true;while(q.length){const f=q.shift();try{await f();setSave("ok")}catch(e){if(e&&(e.code==="invalid_argument"||e.code==="permission_denied")){canWrite=false;setSave("local","공유 저장소에 쓸 권한이 없어 이 기기에만 저장됩니다")}else setSave("local","저장 실패 · 이 기기에만 저장됨");q.length=0}}busy=false}
let saveMsg="이 기기에 저장됨";
function setSave(s,m){const el=$("saveState");el.dataset.s=s;saveMsg=m||(s==="ok"?"공유 저장소(내 전용)에 저장됨":"이 기기에 저장됨");el.title=saveMsg;el.setAttribute("aria-label","저장 상태: "+saveMsg);const t=$("saveTxt");if(t)t.textContent=saveMsg}
function put(r){r.updatedAt=Date.now();r.createdAt=r.createdAt||r.updatedAt;state.recs[r.id]=r;lsSave();push(r.id);render()}
let first=true,uid=null;
async function connect(){
  if(!window.claude||!window.claude.use){setSave("local","이 휴대폰에만 저장됨 · 백업 파일을 꼭 받아 두세요");return}
  try{db=await window.claude.use("db")}catch(e){db=null}
  let user=null;try{user=await window.claude.use("user")}catch(e){}
  try{uid=user&&await user.id()}catch(e){uid=null}
  if(!db||!uid){setSave("local","이 기기에 저장됨 · 공유 저장소 연결 안 됨");return}
  col=db.collection("data/users/"+uid);
  setSave("ok");
  col.onSnapshot(snap=>{
    const remote={};snap.docs.forEach(d=>{const x=d.data();if(x&&x.kind)remote[d.id]={...x,id:d.id}});
    Object.values(remote).forEach(take);
    const up=first?Object.keys(state.recs).filter(id=>!remote[id]||ts(state.recs[id])>ts(remote[id])):[];
    first=false;lsSave();render();if(up.length)setTimeout(()=>up.forEach(push),0);
  },()=>setSave("local","불러오지 못했습니다 · 이 기기 기록으로 표시"));
  loadPref();initExtras();
}

/* ── 계산 ── */
const live=k=>Object.values(state.recs).filter(r=>r.kind===k&&!r.deleted);
const members=()=>live("member").sort((a,b)=>(a.order??99)-(b.order??99)||ts(a)-ts(b));
const mById=id=>state.recs[id]&&!state.recs[id].deleted?state.recs[id]:null;
const policies=()=>live("policy");
const isActive=p=>p.status==="keep"||p.status==="paid"||!p.status;
function paying(p,t=today0()){if(p.status&&p.status!=="keep")return false;const e=pd(p.payEnd);return !e||e>=t}
function monthly(p){const a=num(p.premium);return p.payCycle==="year"?a/12:a}
function remain(p){const e=pd(p.payEnd);if(!e||!paying(p))return null;const t=today0();const m=(e.getFullYear()-t.getFullYear())*12+(e.getMonth()-t.getMonth())+1;return Math.max(0,m)}
function age(b){const d=pd(b);if(!d)return null;const t=today0();let a=t.getFullYear()-d.getFullYear();if(t<new Date(t.getFullYear(),d.getMonth(),d.getDate()))a--;return a}
/* 보험나이: 만나이에서 마지막 생일 후 6개월이 지나면 +1. 상령일 = 생일 + 6개월 */
function insAge(b){const d=pd(b);if(!d)return null;const a=age(b),t=today0();let last=new Date(t.getFullYear(),d.getMonth(),d.getDate());if(last>t)last=new Date(t.getFullYear()-1,d.getMonth(),d.getDate());return addM(last,6)<=t?a+1:a}
function nextUp(b){const d=pd(b);if(!d)return null;const t=today0();for(let y=t.getFullYear()-1;y<=t.getFullYear()+1;y++){const u=addM(new Date(y,d.getMonth(),d.getDate()),6);if(u>t)return u}return null}
function memberColor(m){return m&&m.color||COLORS[0]}
function polName(p){return p?(p.product||p.company||"이름 없는 보험"):"(지운 보험)"}

function events(){
  const t=today0(),lim=180,out=[];
  const add=(d,title,sub,warnDays=30)=>{if(!d)return;const n=days(t,d);if(n>=0&&n<=lim)out.push({d,n,title,sub,soon:n<=warnDays})};
  policies().forEach(p=>{const m=mById(p.insured);const who=m?m.name:"";
    if(paying(p))add(pd(p.payEnd),"납입 완료",`${who} · ${polName(p)}`);
    if(isActive(p))add(pd(p.end),"보험 만기",`${who} · ${polName(p)}`,60);
    if(isActive(p)&&p.renew)add(pd(p.renewDate),"갱신 (보험료 변동 확인)",`${who} · ${polName(p)}`,60);
  });
  members().forEach(m=>{const u=nextUp(m.birth);if(u)add(u,`보험나이 ${insAge(m.birth)+1}세로 바뀜`,`${m.name} · 새로 가입하면 이날부터 보험료 기준이 바뀝니다`,14)});
  live("claim").forEach(c=>{if(c.status!=="ready")return;const d=pd(c.date);if(!d)return;const lim3=new Date(d.getFullYear()+3,d.getMonth(),d.getDate());add(lim3,"청구 기한 (사고일+3년)",`${(mById(c.member)||{}).name||""} · ${c.reason||c.hospital||"청구 준비"}`,90)});
  return out.sort((a,b)=>a.d-b.d);
}

/* ── 화면 ── */
function render(){
  document.querySelectorAll("nav.tabs [data-view]").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.view===state.view)));
  ["home","pol","claim","fam"].forEach(v=>{$("v"+v[0].toUpperCase()+v.slice(1)).hidden=state.view!==v});
  const ps=policies(),act=ps.filter(isActive);
  $("tbPill").textContent=`보험 ${act.length}건`;$("tPol").textContent=`${act.length}건 유지`;
  if(state.view==="home")renderHome();if(state.view==="pol")renderPol();if(state.view==="claim")renderClaim();if(state.view==="fam")renderFam();
}
function noMembers(){return `<div class="empty">먼저 보험을 관리할 가족을 등록해 주세요.<br><button class="btn pri" type="button" data-addmem="1">＋ 가족 등록</button></div>`}
function renderHome(){
  const ms=members(),ps=policies(),pay=ps.filter(p=>paying(p));
  const tot=pay.reduce((s,p)=>s+monthly(p),0);
  const d=new Date();
  let h=`<div class="dayhead"><h2>우리 가족 보험 한눈에</h2><div class="meta">${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 기준 · 가족 ${ms.length}명 · 유지 중 ${ps.filter(isActive).length}건</div></div>`;
  if(!ms.length){$("vHome").innerHTML=h+noMembers();return}
  const left=pay.reduce((s,p)=>{const r=remain(p);return s+(r==null?0:r*monthly(p))},0);
  const noEnd=pay.filter(p=>!pd(p.payEnd)).length;
  h+=`<div class="kpi"><div class="sub">이번 달 내는 보험료 (납입 중 ${pay.length}건)</div><div class="big">${Math.round(tot).toLocaleString("ko-KR")}<small>원</small></div><div class="sub">1년 ${won(tot*12)} · 앞으로 남은 납입 ${won(left)}${noEnd?` <span class="tagx warn">납입 종료일 없는 ${noEnd}건 제외</span>`:""}</div>`;
  const per=ms.map(m=>[m,pay.filter(p=>p.insured===m.id).reduce((s,p)=>s+monthly(p),0)]);
  const mx=Math.max(1,...per.map(x=>x[1]));
  h+=`<div class="bars">${per.map(([m,v])=>`<div class="bar"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(m.name)}</span><span class="trk"><span class="fil" style="display:block;width:${v/mx*100}%;background:${esc(memberColor(m))}"></span></span><b>${won(v)}</b></div>`).join("")}</div>`;
  const inc=num(getSet().income);
  if(inc)h+=`<p class="note ${tot/inc>0.1?"warn":"tip"}">월 가구 소득 ${won(inc)} 대비 보험료 ${(tot/inc*100).toFixed(1)}%</p>`;
  h+=`</div>`;
  const ev=events();
  h+=`<section class="box"><h3>가족별 보험 분석 (누적)</h3>${ms.map(m=>{const rs=reviews(m.id),r=rs[0],pv=rs[1];const sc=r&&num(r.result&&r.result.score),ps=pv&&num(pv.result&&pv.result.score);
    return `<div class="row" style="align-items:center"><span class="l" style="display:flex;gap:10px;align-items:center"><span class="mono sm" style="background:${esc(memberColor(m))}">${esc(m.name.slice(0,1))}</span><span><b style="font-weight:600">${esc(m.name)}</b>${r?` <span style="font-weight:600;white-space:nowrap">${sc}점</span> <span class="tagx ${GRADE_C[r.result.grade]||""}">${esc(r.result.grade||"")}</span> ${pv?diffTag(sc-ps):""}`:""}<small>${r?`${dshort(ymd(new Date(r.at)))} 분석 · 누적 ${rs.length}회`:"아직 분석 전"}</small></span></span><span class="r"><button class="btn sm line" type="button" data-review="${m.id}">${r?"보기":"분석"}</button></span></div>`}).join("")}</section>`;
  h+=`<section class="box"><h3>다가오는 일정 (180일)</h3>${ev.length?ev.slice(0,8).map(e=>`<div class="ev"><span class="dd ${e.soon?"soon":""}">${e.n===0?"오늘":"D-"+e.n}</span><div><b>${esc(e.title)}</b><small>${dshort(ymd(e.d))} · ${esc(e.sub)}</small></div></div>`).join(""):`<p class="meta2">180일 안에 예정된 납입 완료·만기·갱신이 없습니다.</p>`}</section>`;
  h+=`<section class="box"><h3>가족별 주요 보장 (가입금액 합계)</h3><div class="mxw"><table class="mx"><thead><tr><th>보장</th>${ms.map(m=>`<th>${esc(m.name)}</th>`).join("")}</tr></thead><tbody>${MX.map(k=>`<tr><td>${COVN[k]}</td>${ms.map(m=>{const v=covSum(m.id,k);return k==="sil"?(v.n?`<td class="yes">있음${v.n>1?` ${v.n}건`:""}</td>`:`<td class="no">없음</td>`):(v.amt?`<td class="yes">${man(v.amt)}</td>`:`<td class="no">없음</td>`)}).join("")}</tr>`).join("")}</tbody></table></div>
  <p class="meta2" style="margin-top:8px">유지 중인 보험의 '보장 내용'에 입력한 금액을 더한 값입니다. '없음'은 입력된 보장이 없다는 뜻이며, 실제 증권과 다를 수 있습니다.${ms.some(m=>covSum(m.id,"sil").n>1)?" 실손은 여러 건이어도 실제 쓴 비용 안에서 나눠 지급됩니다.":""}</p></section>`;
  const days31=pay.filter(p=>num(p.payDay)>0).sort((a,b)=>num(a.payDay)-num(b.payDay));
  if(days31.length)h+=`<section class="box"><h3>매달 빠져나가는 날</h3>${days31.map(p=>`<div class="row"><span class="l">${num(p.payDay)}일 · ${esc(polName(p))}<small>${esc((mById(p.insured)||{}).name||"")} · ${esc(p.company||"")} · ${esc(p.payMethod||"")}</small></span><span class="r">${won(monthly(p))}</span></div>`).join("")}</section>`;
  $("vHome").innerHTML=h;
}
function covSum(mid,k){let amt=0,n=0;policies().filter(p=>p.insured===mid&&isActive(p)).forEach(p=>{let hit=false;(p.covers||[]).forEach(c=>{if(c.cat===k){amt+=num(c.amt);hit=true}});if(!hit&&k==="sil"&&p.type==="실손")hit=true;if(hit)n++});return{amt,n}}

function renderPol(){
  const ms=members();
  let h=`<div class="dayhead"><h2>가입한 보험</h2><div class="meta">카드를 누르면 자세히 보고 고칠 수 있습니다</div></div>`;
  if(!ms.length){$("vPol").innerHTML=h+noMembers();return}
  const ps=policies();
  if(state.mem&&!mById(state.mem))state.mem=null;
  h+=`<div class="chips">${[[null,"전체",ps.length],...ms.map(m=>[m.id,m.name,ps.filter(p=>p.insured===m.id).length])].map(([k,l,n])=>`<button class="chip" type="button" data-mem="${k??""}" aria-pressed="${state.mem===k}">${esc(l)} ${n}</button>`).join("")}</div>`;
  const list=ps.filter(p=>!state.mem||p.insured===state.mem).sort((a,b)=>(isActive(b)-isActive(a))||(monthly(b)-monthly(a)));
  h+=`<div class="frow" style="margin-top:10px"><button class="btn pri" type="button" data-addpol="1" style="flex:1;min-height:46px">＋ 보험 등록</button></div>`;
  h+=list.length?`<ul class="list">${list.map(polCard).join("")}</ul>`:`<div class="empty">등록된 보험이 없습니다. 보험증권이나 보험사 앱의 '계약 조회' 화면을 보면서 입력해 주세요.</div>`;
  $("vPol").innerHTML=h;
}
/* 카드에 보이는 주요 정보: 보장기간·납입기간·갱신·주요 보장 */
function ageAt(b,d){const x=pd(b);if(!x||!d)return null;let a=d.getFullYear()-x.getFullYear();if(d<new Date(d.getFullYear(),x.getMonth(),x.getDate()))a--;return a}
const yrs=(a,b)=>Math.round((b-a)/(365.25*864e5));
const ym=s=>{const d=pd(s);return d?`${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,"0")}`:""};
const leftTxt=(t,E)=>{const mo=(E.getFullYear()-t.getFullYear())*12+(E.getMonth()-t.getMonth());return mo>=12?`${Math.floor(mo/12)}년${mo%12?" "+(mo%12)+"개월":""} 남음`:`${Math.max(mo,0)}개월 남음`};
function shortCov(c){let n=String(c.name||"").replace(/\s*\/\s*보통약관/g,"").replace(/\([^()]*\)/g,"").replace(/\[[^\]]*\]/g,"").replace(/[()\[\]]/g,"").replace(/^무배당\s*/,"").trim();if(!n)n=COVN[c.cat]||"";return n.length>14?n.slice(0,13)+"…":n}
function polInfo(p,m,r){
  const S=pd(p.start),E=pd(p.end),P=pd(p.payEnd),t=today0(),rows=[];
  if(S||E){const ea=m&&E?ageAt(m.birth,E):null;rows.push(["보장기간",`${S?ym(p.start):"?"} ~ ${E?ym(p.end):"만기 미입력"}${ea!=null?` (${ea}세까지)`:""}${E?(E>t?` · ${leftTxt(t,E)}`:" · 만기 지남"):""}`])}
  if(P){const n=S?yrs(S,P):null;rows.push(["납입기간",`${ym(p.payEnd)}까지${n?` · ${n}년납`:""}${paying(p)?(r!=null?` · 남은 ${r}회`:""):" · 납입 완료"}`])}
  rows.push(["갱신",p.renew?`${p.renewYears?p.renewYears+"년마다 ":""}갱신${p.renewDate?` · 다음 ${ym(p.renewDate)}`:""}`:"비갱신"]);
  const cs=(p.covers||[]).filter(c=>c.cat||c.name);
  if(cs.length){const sil=cs.some(c=>c.cat==="sil");const top=cs.filter(c=>num(c.amt)>0&&c.cat!=="sil").sort((a,b)=>num(b.amt)-num(a.amt)).slice(0,4);
    const parts=(sil?["실손"]:[]).concat(top.map(c=>`${shortCov(c)} ${man(num(c.amt))}`));const rest=cs.length-top.length-cs.filter(c=>c.cat==="sil").length;
    rows.push(["주요 보장",esc(parts.join(" · "))+(rest>0?` <span class="meta2">외 ${rest}개</span>`:"")])}
  else rows.push(["주요 보장",`<span class="meta2">입력 없음</span>`]);
  return `<span class="pinfo">${rows.map(([k,v])=>`<span class="pi"><span class="k">${k}</span><span class="v">${k==="주요 보장"?v:esc(v)}</span></span>`).join("")}</span>`;
}
function polCard(p){
  const m=mById(p.insured),r=remain(p);
  const st=p.status||"keep",stc=st==="keep"?(paying(p)?"ok":""):st==="paid"?"":"bad";
  const stl=st==="keep"&&!paying(p)?"납입완료":STATUS[st];
  return `<li><button class="card ${isActive(p)?"":"off"}" type="button" data-pol="${p.id}"><span class="mono" style="background:${esc(memberColor(m))}">${esc((m?m.name:"?").slice(0,1))}</span>
  <span style="min-width:0"><span class="nm clamp2">${esc(polName(p))}</span><span class="ds" style="display:block">${esc(p.company||"")}${p.type?" · "+esc(p.type):""}${m?" · "+esc(m.name):""}</span>
  <span class="mt"><span class="tagx ${stc}">${stl}</span>${p.renew?`<span class="tagx warn">갱신형</span>`:""}${(p.files||[]).length?`<span>자료 ${(p.files||[]).length}</span>`:""}</span></span>
  <span class="amt">${paying(p)?won(monthly(p)):"-"}<small>${p.payCycle==="year"?"연납 월환산":"월"}</small></span>${polInfo(p,m,r)}</button></li>`;
}

function renderClaim(){
  const ms=members(),cs=live("claim").sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  const y=String(new Date().getFullYear());

${prev?`지난 분석(${ymd(new Date(prev.at))}): ${num(prev.result.score)}점, ${prev.result.grade||""}. 부족했던 점: ${(prev.result.gaps||[]).join(" / ").slice(0,600)}\nchange 항목에 지난 분석과 비교한 변화를 적으세요.`:"지난 분석이 없으니 change는 빈 문자열로 두세요."}

=== 자료 ===

function cleanReview(o){
  if(!o||typeof o!=="object")throw{code:"invalid_json"};
  const arr=v=>Array.isArray(v)?v.filter(x=>x!=null&&x!=="").map(x=>typeof x==="string"?x.slice(0,300):x).slice(0,10):[];
  const score=Math.max(0,Math.min(100,Math.round(num(o.score))));
  return {score,grade:["충분","양호","보통","부족","매우 부족"].includes(o.grade)?o.grade:(score>=80?"양호":score>=60?"보통":"부족"),summary:String(o.summary||"").slice(0,600),
    coverage:arr(o.coverage).filter(c=>c&&COVN[c.cat]).map(c=>({cat:c.cat,status:String(c.status||""),comment:String(c.comment||"").slice(0,200)})),
    strengths:arr(o.strengths),gaps:arr(o.gaps),overlaps:arr(o.overlaps),cautions:arr(o.cautions),premium:String(o.premium||"").slice(0,400),
    guide:arr(o.guide).filter(g=>g&&g.title).map(g=>({title:String(g.title).slice(0,80),detail:String(g.detail||"").slice(0,400)})),change:String(o.change||"").slice(0,300)};
}
async function runReview(mid){
  const m=mById(mid);if(!m||rvBusy||!extras.sample)return;
  const ps=policies().filter(p=>p.insured===mid&&isActive(p));
  if(!ps.length){toast("유지 중인 보험이 없어 분석할 수 없습니다");return}
  rvBusy=mid;openReview(mid);
  const prev=reviews(mid)[0];
  try{
    const o=cleanReview(await extras.sample.json(reviewPrompt(m,prev),{modelTier:"complex"}));
    const r={id:newId("r"),kind:"review",member:mid,at:Date.now(),basis:{count:ps.length,monthly:Math.round(ps.filter(p=>paying(p)).reduce((s,p)=>s+monthly(p),0)),age:age(m.birth)},result:o,deleted:false};
    rvBusy=null;put(r);
    if(state.rv===mid)openReview(mid,r.id);else toast(`${m.name} 보험 분석이 끝났습니다`);
  }catch(e){
    rvBusy=null;const c=e&&e.code;
    const msg=c==="not_granted"?"Claude에게 보험 자료를 보내는 것을 허용하지 않아 분석할 수 없습니다.":c==="rate_limited"?"잠시 후 다시 시도해 주세요.":"분석하지 못했습니다. 잠시 후 다시 시도해 주세요.";
    if(state.rv===mid){openReview(mid);const el=$("rvMsg");if(el){el.textContent=msg+` (오류: ${c||"?"})`;el.hidden=false}}else toast(msg);
  }

/* ── 보관 자료 보기: 앱 안에서 열기 (새 창 링크는 Claude 앱·휴대폰에서 막힘). 비밀번호 PDF는 여기서 비밀번호 입력 ── */
let fv=null;
/* 자료 주소: 현재 화면에 맞는 주소를 assets.list()에서 받고, 없으면 /_blob/<id> */
let assetUrls=null;
async function assetUrl(id){
  if(!assetUrls&&extras.assets){try{const r=await extras.assets.list();assetUrls={};(r.assets||[]).forEach(a=>{if(a&&a.id)assetUrls[a.id]=a.url})}catch(e){assetUrls={}}}
  return (assetUrls&&assetUrls[id])||("/_blob/"+id);
}
/* 설치판(휴대폰)에서는 첨부 파일을 이 기기 안(IndexedDB)에 보관. 백업 파일에서 복원하면 채워짐 */
const IDB="myapps-insurance-files";
function idb(){return new Promise((ok,no)=>{try{const r=indexedDB.open(IDB,1);r.onupgradeneeded=()=>r.result.createObjectStore("files");r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}catch(e){no(e)}})}
async function idbGet(id){const d=await idb();return new Promise((ok,no)=>{const q=d.transaction("files").objectStore("files").get(id);q.onsuccess=()=>ok(q.result||null);q.onerror=()=>no(q.error)})}
async function idbPut(id,v){const d=await idb();return new Promise((ok,no)=>{const t=d.transaction("files","readwrite");t.objectStore("files").put(v,id);t.oncomplete=()=>ok();t.onerror=()=>no(t.error)})}
async function getFileBlob(id,me){
  if(extras.assets){const u=await assetUrl(id);if(me)me.url=u;const r=await fetch(u,{credentials:"same-origin"});if(!r.ok)throw{code:"http_"+r.status};return r.blob()}
  let v=null;try{v=await idbGet(id)}catch(e){}
  if(v&&v.blob)return v.blob;
  throw{code:"local_missing"};
}
const errTxt=e=>{if(!e)return"?";if(typeof e==="string")return e;return [e.code,e.name,e.message].filter(Boolean).join(" · ").slice(0,120)||"?"};
async function openFile(pid,fid){
  const p=state.recs[pid];const f=p&&(p.files||[]).find(x=>x.id===fid);if(!f)return;
  fv={pid,fid,f,blob:null,url:null};const me=fv;
  sheet(esc(f.name||"자료"),`<div style="margin-top:12px"></div><p class="note tip" id="fvMsg">불러오는 중입니다…</p>
    <div id="fvPw" hidden style="margin-top:8px"><label class="fld">PDF 비밀번호<input id="fvPwIn" type="password" autocomplete="off" placeholder="보통 생년월일 6자리 또는 8자리"></label><button class="btn pri" type="button" id="fvPwOk" style="width:100%;margin-top:6px">비밀번호로 열기</button><p class="meta2" style="margin-top:4px">비밀번호는 저장하지 않습니다.</p></div>

    step="내려받기";
    const blob=await getFileBlob(fid,me);if(fv!==me)return;me.blob=blob;step="형식";
    const head=String.fromCharCode(...new Uint8Array(await blob.slice(0,5).arrayBuffer()));
    if(head==="%PDF-"){step="PDF";await fvPdf(me)}

function fvErr(e,step){const m=$("fvMsg");if(!m)return;m.hidden=false;m.className="note warn";
  if(e&&e.code==="local_missing"){m.innerHTML=`이 휴대폰에는 첨부 파일이 아직 없습니다. 첨부 파일은 Claude판(보험관리)에 저장되어 있습니다.<br>Claude판에서 받은 <b>백업 파일</b>을 이 앱의 가족 탭 → <b>'파일에서 복원'</b>으로 불러오면 이 휴대폰에서도 볼 수 있습니다.`;return}
  m.innerHTML=`자료를 열지 못했습니다(${esc(step||"")} 단계). '파일 저장'으로 받아 휴대폰·PC에서 열어 보세요.<br><small>오류: ${esc(errTxt(e))}</small>${fv&&fv.url?`<br><a href="${esc(fv.url)}" target="_blank" rel="noopener" style="font-weight:600">원본 새 창으로 열기</a>`:""}`}
/* PDF는 화면에 가까워진 쪽만 그리고, 그린 뒤 그림(JPEG)으로 바꿔 메모리를 아낌. 쪽마다 실패해도 나머지는 표시 */
async function fvPdf(me,pw){
  const msg=$("fvMsg");msg.hidden=false;msg.className="note tip";msg.textContent="PDF를 여는 중입니다…";
  let lib;try{lib=await getPdfLib()}catch(e){throw{code:"pdf_load",message:"PDF 도구를 불러오지 못함"}}
  let doc;
  try{doc=await lib.getDocument({data:new Uint8Array((await me.blob.arrayBuffer()).slice(0)),password:pw||undefined,cMapUrl:PDFJS+"cmaps/",cMapPacked:true,standardFontDataUrl:PDFJS+"standard_fonts/",isEvalSupported:false}).promise}
  catch(e){if(e&&e.name==="PasswordException"){$("fvPw").hidden=false;msg.textContent=e.code===2?"비밀번호가 맞지 않습니다. 다시 입력해 주세요.":"비밀번호가 걸린 증권입니다. 비밀번호를 입력해 주세요.";const i=$("fvPwIn");i.value="";setTimeout(()=>i.focus(),50);return}throw{code:"pdf_bad",name:e&&e.name,message:e&&e.message}}
  $("fvPw").hidden=true;me.doc=doc;
  const box=$("fvPages");box.innerHTML="";const N=Math.min(doc.numPages,50),W=Math.min(box.clientWidth||520,560),dpr=Math.min(1.5,window.devicePixelRatio||1);
  let done=0,fail=0;
  const status=()=>{if(fv!==me)return;msg.textContent=`전체 ${doc.numPages}쪽${doc.numPages>N?` 중 앞 ${N}쪽 표시 (전체는 '파일 저장')`:""}${fail?` · ${fail}쪽은 표시하지 못함`:""}`};
  const queue=[];let busy=false;
  const renderPage=async(i,slot)=>{
    try{const pg=await doc.getPage(i);const v0=pg.getViewport({scale:1});const vp=pg.getViewport({scale:W/v0.width*dpr});
      const cv=document.createElement("canvas");cv.width=Math.round(vp.width);cv.height=Math.round(vp.height);
      await pg.render({canvasContext:cv.getContext("2d"),viewport:vp}).promise;
      const b=await new Promise(r=>cv.toBlob(r,"image/jpeg",.85));cv.width=cv.height=0;pg.cleanup();
      if(fv!==me)return;slot.innerHTML=`<img class="fvpage" alt="${i}쪽" src="${URL.createObjectURL(b)}">`;slot.style.minHeight="";done++}
    catch(e){fail++;slot.innerHTML=`<p class="meta2">${i}쪽을 표시하지 못했습니다 (${esc(errTxt(e))})</p>`;slot.style.minHeight=""}
    status();
  };
  const pump=async()=>{if(busy)return;busy=true;while(queue.length&&fv===me){const [i,slot]=queue.shift();await renderPage(i,slot)}busy=false;if(fv!==me)doc.destroy()};
  const v1=(await doc.getPage(1)).getViewport({scale:1}),ph=Math.round(W*v1.height/v1.width);
  const io="IntersectionObserver" in window?new IntersectionObserver(es=>{es.forEach(en=>{if(en.isIntersecting){io.unobserve(en.target);queue.push([+en.target.dataset.pg,en.target]);pump()}})},{root:$("sheet"),rootMargin:"800px 0px"}):null;
  for(let i=1;i<=N;i++){const slot=document.createElement("div");slot.dataset.pg=i;slot.style.minHeight=ph+"px";slot.className="fvslot";box.appendChild(slot);if(io)io.observe(slot);else queue.push([i,slot])}
  if(!io)pump();
  status();
}
async function saveAsset(){

/* ── 증권 사진 자동 채우기 · 자료 보관 (Claude 앱에서만) ── */

/* PDF 읽기: pdf.js를 필요할 때만 불러옴. 비밀번호는 메모리에서만 쓰고 저장하지 않음 */
const PDFJS="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
let pdfLib=null,pendingPdf=null;
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=()=>no(new Error("load"));document.head.appendChild(s)})}
async function getPdfLib(){if(pdfLib)return pdfLib;await loadScript(PDFJS+"pdf.worker.min.js");await loadScript(PDFJS+"pdf.min.js");pdfLib=window.pdfjsLib;pdfLib.GlobalWorkerOptions.workerSrc=PDFJS+"pdf.worker.min.js";return pdfLib}
const isPdf=f=>f&&(f.type==="application/pdf"||/\.pdf$/i.test(f.name||""));
/* 고른 파일을 바로 메모리에 복사: 이후 비밀번호 입력·재시도·자료 보관 모두 이 복사본을 씀 */
async function toMem(f){const buf=await f.arrayBuffer();const h=new Uint8Array(buf.slice(0,5));const pdf=String.fromCharCode(...h)==="%PDF-";
  let type=pdf?"application/pdf":(f.type||(/\.png$/i.test(f.name||"")?"image/png":"image/jpeg"));let name=f.name||(pdf?"증권.pdf":"증권 사진.jpg");if(pdf&&!/\.pdf$/i.test(name))name+=".pdf";
  return new File([buf],name,{type})}
function ocrPrompt(src){return `${src} 보이는 내용만 읽어 아래 JSON 하나로만 답하세요. 없는 값은 빈 문자열로 두고 추측하지 마세요.
주민등록번호, 계좌번호, 카드번호는 절대 옮기지 마세요. 증권번호는 마지막 4자리 숫자만 no4에 넣으세요.
여러 계약이 있으면 첫 번째 주계약 기준으로 답하세요. 담보(특약)는 모두 covers에 넣으세요.
{"company":"보험사명","product":"상품명","type":"${TYPES.join("|")} 중 하나","holder":"계약자 이름","insuredName":"피보험자 이름","no4":"","start":"YYYY-MM-DD 계약일","payEnd":"YYYY-MM-DD 납입 종료일(납입기간으로 계산 가능하면 계산)","end":"YYYY-MM-DD 만기일","premium":숫자(원, 1회 보험료 합계),"payCycle":"month|year","renew":true|false,"renewYears":숫자 또는 "","companyTel":"보험사 고객센터 번호","covers":[{"cat":"${COV.map(c=>c[0]).join("|")} 중 하나","name":"담보명 그대로","amt":숫자(만원 단위 가입금액, 실손은 0)}]}`}
function setOcr(m){const el=$("ocrMsg");if(el)el.textContent=m}
function showPw(on,msg){const b=$("pwBox");if(!b)return;b.hidden=!on;if(on){const i=$("pwIn");i.value="";setTimeout(()=>i.focus(),50)}if(msg)setOcr(msg)}
async function runOcr(file,pw){
  const btn=$("ocrPick");if(!btn)return;
  btn.classList.add("busy");
  try{
    if(isPdf(file))await fromPdf(file,pw);
    else{
      if(!extras.lim||!extras.lim.images){setOcr("이 화면에서는 사진을 보낼 수 없습니다. PDF 파일로 올리거나 직접 입력해 주세요.");return}
      setOcr("사진을 읽는 중입니다… (10~30초)");
      fill(await extras.sample.json(ocrPrompt("이 이미지는 한국 보험증권 또는 보험사 앱의 계약 정보 화면입니다."),{images:[file.type?file:new Blob([file],{type:"image/jpeg"})],modelTier:"default"}),file);
    }
  }catch(e){
    const c=e&&e.code;
    setOcr(c==="not_granted"?"Claude에게 증권 내용을 보내는 것을 허용하지 않아 자동 채우기를 쓸 수 없습니다. 직접 입력해 주세요.":c==="rate_limited"?"잠시 후 다시 시도해 주세요.":c==="image_rejected"?"이 사진은 읽을 수 없습니다. 다른 사진(JPG·PNG)으로 해 주세요.":c==="pdf_load"?"PDF 도구를 불러오지 못했습니다. 인터넷 연결을 확인하고 다시 시도해 주세요.":c==="pdf_bad"?"PDF 파일을 열지 못했습니다.":c==="empty"?"분석은 했지만 증권 항목을 찾지 못했습니다.":c==="invalid_json"?"분석 결과를 정리하지 못했습니다.":"내용을 읽지 못했습니다.");
    setOcr($("ocrMsg").textContent+` (오류: ${c||(e&&e.name)||"?"}${e&&e.detail?" · "+String(e.detail).slice(0,60):""}) 직접 입력해 주세요.`);
  }finally{btn.classList.remove("busy")}
}
async function fromPdf(file,pw){
  setOcr("PDF를 여는 중입니다…");
  let lib;try{lib=await getPdfLib()}catch(e){throw{code:"pdf_load"}}
  let doc;
  try{doc=await lib.getDocument({data:new Uint8Array((await file.arrayBuffer()).slice(0)),password:pw||undefined,cMapUrl:PDFJS+"cmaps/",cMapPacked:true,standardFontDataUrl:PDFJS+"standard_fonts/",isEvalSupported:false}).promise}
  catch(e){
    if(e&&e.name==="PasswordException"){pendingPdf=file;showPw(true,e.code===2?"비밀번호가 맞지 않습니다. 다시 입력해 주세요.":"비밀번호가 걸린 PDF입니다. 비밀번호를 입력해 주세요.");return}
    throw{code:"pdf_bad",detail:(e&&(e.name||e.message))||""};
  }
  pendingPdf=null;showPw(false);
  const n=Math.min(doc.numPages,8);let text="";
  setOcr(`PDF ${doc.numPages}쪽을 읽는 중입니다…`);
  for(let i=1;i<=n;i++){try{const pg=await doc.getPage(i);const tc=await pg.getTextContent();text+=`\n[${i}쪽]\n`+tc.items.map(it=>(it.str||"")+(it.hasEOL?"\n":" ")).join("")}catch(e){}}
  text=text.replace(/(\d{6})\s*-?\s*([1-8])\d{6}/g,"$1-$2******"); /* 주민번호 뒷자리는 보내기 전에 가림 */
  const clean=text.replace(/\s+/g,"");
  const good=(clean.match(/[가-힣A-Za-z0-9]/g)||[]).length/Math.max(1,clean.length);
  let o;
  if(clean.length>=150&&good>=0.5){
    setOcr("증권 내용을 분석하는 중입니다… (10~30초)");
    o=await extras.sample.json(ocrPrompt("아래는 한국 보험증권 PDF에서 뽑은 글자입니다. 표가 줄 단위로 섞여 있을 수 있습니다.")+"\n\n=== 증권 내용 ===\n"+text.slice(0,60000),{modelTier:"default"});
  }else{
    /* 글자가 없는 스캔 PDF: 앞쪽 몇 장을 그림으로 바꿔 보냄 */
    if(!extras.lim||!extras.lim.images){setOcr("글자가 없는 스캔 PDF라 이 화면에서는 읽을 수 없습니다. 직접 입력해 주세요.");doc.destroy();return}
    setOcr("스캔된 PDF라 그림으로 바꿔 분석하는 중입니다… (20~40초)");
    const imgs=[];const m=Math.min(doc.numPages,extras.lim.images.maxCount||3,3);
    for(let i=1;i<=m;i++){const pg=await doc.getPage(i);const v0=pg.getViewport({scale:1});const vp=pg.getViewport({scale:Math.min(2,1200/v0.width)});
      const cv=document.createElement("canvas");cv.width=Math.round(vp.width);cv.height=Math.round(vp.height);
      await pg.render({canvasContext:cv.getContext("2d"),viewport:vp}).promise;
      imgs.push(await new Promise(r=>cv.toBlob(r,"image/jpeg",.85)))}
    o=await extras.sample.json(ocrPrompt("이 이미지들은 한국 보험증권 PDF의 앞쪽 페이지입니다."),{images:imgs.filter(Boolean),modelTier:"default"});
  }
  doc.destroy();fill(o,file);
}
function fill(o,file){
  if(!o||typeof o!=="object")throw{code:"invalid_json"};
  if(!o.company&&!o.product&&!num(o.premium)&&!(Array.isArray(o.covers)&&o.covers.length))throw{code:"empty"};
  if(!$("pIns"))return;
  const g=(k,v)=>{const el=$(k);if(el&&v!==undefined&&v!==null&&v!=="")el.value=v};
  g("pCo",o.company);g("pProd",o.product);if(TYPES.includes(o.type))g("pType",o.type);g("pHolder",o.holder);
  g("pNo",String(o.no4||"").replace(/\D/g,"").slice(-4));
  ["start","payEnd","end"].forEach(k=>{if(/^\d{4}-\d{2}-\d{2}$/.test(o[k]||""))g({start:"pStart",payEnd:"pPayEnd",end:"pEnd"}[k],o[k])});
  if(num(o.premium))g("pPrem",num(o.premium).toLocaleString("ko-KR"));if(o.payCycle==="year")g("pCyc","year");
  if(o.renew===true){$("pRenew").checked=true;$("renewRow").hidden=false;if(num(o.renewYears))g("pRy",num(o.renewYears))}
  g("pCt",o.companyTel);
  if(o.insuredName){const m=members().find(m=>m.name&&(m.name===o.insuredName||String(o.insuredName).includes(m.name)));if(m)g("pIns",m.id)}
  const cv=Array.isArray(o.covers)?o.covers.filter(c=>c&&COVN[c.cat]).slice(0,40):[];
  if(cv.length){$("covList").insertAdjacentHTML("beforeend",cv.map(c=>covRow({id:newId("c"),cat:c.cat,amt:num(c.amt)||"",name:String(c.name||"").slice(0,40)})).join(""))}
  setOcr(`읽어서 채웠습니다${cv.length?` (보장 ${cv.length}개)`:""}. 증권과 맞는지 한 번 확인한 뒤 저장해 주세요.${file&&isPdf(file)&&extras.assets?" 원본 PDF는 보관 자료에 넣었습니다(비밀번호는 그대로 걸려 있습니다).":""}`);
  if(file&&extras.assets)attach(file,true);
}
async function attach(file,quiet){
  if(!extras.assets||!state.edit)return;
  if(file.size>20*1024*1024){toast("20MB 이하 파일만 올릴 수 있습니다");return}
  const ed=state.edit;if(!quiet)toast("올리는 중입니다…");
  try{const ty=file.type||(isPdf(file)?"application/pdf":/\.png$/i.test(file.name||"")?"image/png":"image/jpeg");const r=await extras.assets.upload(file,{type:ty});ed.files=[...(ed.files||[]),{id:r.id,name:file.name||"증권 사진",type:ty,size:r.sizeBytes,addedAt:Date.now()}];
    if(state.edit===ed&&$("fileList"))$("fileList").innerHTML=fileRows(ed);if(!quiet)toast("자료를 올렸습니다. 저장을 눌러야 보험에 연결됩니다")}
  catch(e){toast(e&&e.code==="unsupported_type"?"사진이나 PDF만 올릴 수 있습니다":e&&e.code==="quota_or_state"?"저장 공간이 가득 찼습니다":"올리지 못했습니다")}
}

let tt;function toast(m,undoId){const t=$("toast");t.textContent=m;if(undoId){const b=document.createElement("button");b.type="button";b.className="undo";b.dataset.undo=undoId;b.textContent="되돌리기";t.appendChild(b)}t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>{t.hidden=true},undoId?7000:2600)}
async function copyText(t){try{await navigator.clipboard.writeText(t);return true}catch(e){return false}}
const backup=()=>JSON.stringify({app:"우리 가족 보험관리",v:1,exportedAt:new Date().toISOString(),recs:state.recs},null,1);
/* 백업 v2: 기록 + 첨부 파일 내용(base64). 지운 보험의 파일도 포함(되살릴 수 있으므로) */
function allFiles(){const m=new Map();Object.values(state.recs).forEach(r=>{if(r&&r.kind==="policy")(r.files||[]).forEach(f=>{if(f&&f.id&&!m.has(f.id))m.set(f.id,f)})});return m}
const toB64=blob=>new Promise((ok,no)=>{const fr=new FileReader();fr.onload=()=>ok(String(fr.result).split(",")[1]||"");fr.onerror=()=>no(fr.error);fr.readAsDataURL(blob)});
const fromB64=(b,type)=>{const bin=atob(b);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:type||"application/octet-stream"})};
function bkProg(t){const el=$("bkProg");if(!el)return;el.hidden=!t;el.textContent=t||""}
async function backupFull(){
  const fm=[...allFiles().entries()],files={};let miss=[];
  for(let i=0;i<fm.length;i++){const [id,f]=fm[i];bkProg(`첨부 파일 담는 중… ${i+1}/${fm.length}`);
    try{const bl=await getFileBlob(id);files[id]={name:f.name||"",type:f.type||bl.type||"",size:bl.size,data:await toB64(bl)}}catch(e){miss.push(f.name||id)}}
  bkProg("");
  return {text:JSON.stringify({app:"우리 가족 보험관리",v:2,exportedAt:new Date().toISOString(),recs:state.recs,files}),count:Object.keys(files).length,miss};
}
async function assetExists(id){try{const r=await fetch("/_blob/"+id);if(r.body&&r.body.cancel)r.body.cancel().catch(()=>{});return r.ok}catch(e){return false}}
async function restore(txt){let o;try{o=JSON.parse(txt)}catch(e){toast("백업 코드를 읽지 못했습니다");return}
  if(!o||!o.recs||o.app!=="우리 가족 보험관리"){toast("보험관리 백업이 아닙니다");return}
  let n=0;Object.values(o.recs).forEach(r=>{if(take(r)){n++;push(r.id)}});lsSave();render();
  /* 첨부 파일: 저장소에 없는 것만 다시 올리고, 새 번호로 보험 기록을 고침 */
  const fs=o.files&&typeof o.files==="object"?Object.entries(o.files):[];let up=0,keep=0,fail=0;
  if(fs.length&&!extras.assets){let saved=0,had=0,bad=0;
    for(let i=0;i<fs.length;i++){const [id,f]=fs[i];bkProg(`첨부 파일을 이 휴대폰에 저장 중… ${i+1}/${fs.length}`);
      try{const cur=await idbGet(id);if(cur&&cur.blob){had++;continue}await idbPut(id,{blob:fromB64(f.data,f.type||"application/pdf"),name:f.name||"",type:f.type||"",savedAt:Date.now()});saved++}catch(e){bad++}}
    bkProg("");toast(`기록 ${n}건 복원 · 첨부 파일 ${saved}개를 이 휴대폰에 저장${had?`, ${had}개는 이미 있음`:""}${bad?`, ${bad}개 실패`:""}`.replace(/^기록 0건 복원/,"기록은 이미 최신"));return}
  const map={};
  for(let i=0;i<fs.length;i++){const [id,f]=fs[i];bkProg(`첨부 파일 복원 중… ${i+1}/${fs.length}`);
    try{if(await assetExists(id)){keep++;continue}
      /* 예전 복원에서 이미 새 번호로 다시 올린 파일이면 건너뜀 */
      const again=[...allFiles().values()].find(x=>x.origId===id);if(again&&await assetExists(again.id)){keep++;continue}
      const ty=f.type||"application/pdf";const r=await extras.assets.upload(fromB64(f.data,ty),{type:ty});map[id]=r.id;up++}catch(e){fail++}}
  bkProg("");
  if(Object.keys(map).length){const now=Date.now();Object.values(state.recs).forEach(r=>{if(r.kind==="policy"&&(r.files||[]).some(f=>map[f.id])){
      state.recs[r.id]={...r,files:r.files.map(f=>map[f.id]?{...f,id:map[f.id],origId:f.origId||f.id}:f),updatedAt:now};push(r.id)}});lsSave();render()}
  toast(`기록 ${n}건 복원${fs.length?` · 첨부 파일 ${up}개 다시 올림, ${keep}개 그대로${fail?`, ${fail}개 실패`:""}`:""}`.replace(/^기록 0건 복원/,"기록은 이미 최신"));
}
/* 지우기: 문서는 남기고 deleted 표시만. 확인창(confirm)은 Claude 앱에서 막히므로 되돌리기·되살리기로 대신함 */
function softDel(id,msg){const r=state.recs[id];if(!r)return;put({...r,deleted:true,deletedAt:Date.now()});closeSheet();toast(msg,id)}
function undel(id){const r=state.recs[id];if(!r||!r.deleted)return;const x={...r,deleted:false};delete x.deletedAt;put(x);toast("되살렸습니다")}

  if(t.id==="mSave"){saveMember();return}
  if(t.id==="pSave"){savePolicy();return}

  if(t.id==="covAdd"){$("covList").insertAdjacentHTML("beforeend",covRow({id:newId("c"),cat:"cancer"}));const l=$("covList").lastElementChild;l&&l.querySelector("input").focus();return}
  if(t.id==="pwOk"){const pw=$("pwIn").value;if(!pw){toast("비밀번호를 입력해 주세요");return}if(pendingPdf)runOcr(pendingPdf,pw);$("pwIn").value="";return}
  if(t.id==="pwCancel"){pendingPdf=null;showPw(false,"취소했습니다. 직접 입력하시거나 다른 파일을 올려 주세요.");return}
  if(t.id==="bkSave"){saveFile();return}
  if(t.id==="bkCopy"){(async()=>{const j=backup();if(await copyText(j))toast("백업 코드를 복사했습니다");else{$("bkText").value=j;$("bkText").select();toast("아래 칸의 코드를 직접 복사해 주세요")}})();return}

async function saveFile(){
  let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null}catch(e){}
  const d=new Date(),name=`MY미니앱_보험관리_백업_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}.json`;
  if(!dl){try{const b=await backupFull();const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([b.text],{type:"application/json"}));a.download=b.count?name.replace(".json",`_자료${b.count}개.json`):name;document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(a.href)},4000);toast(`백업 파일을 저장했습니다${b.count?` (첨부 파일 ${b.count}개 포함)`:""}`)}catch(e){toast((await copyText(backup()))?"파일 저장이 안 되어 백업 코드를 복사했습니다":"백업 코드 복사를 이용해 주세요")}return}
  const btn=$("bkSave");if(btn)btn.disabled=true;
  try{const b=await backupFull();const fname=b.count?name.replace(".json",`_자료${b.count}개.json`):name;
    await dl.save({filename:fname,data:new Blob([b.text],{type:"application/json"})});
    toast(`백업 파일을 저장했습니다${b.count?` (첨부 파일 ${b.count}개 포함)`:""}${b.miss.length?` · ${b.miss.length}개는 불러오지 못함`:""}`)}
  catch(e){bkProg("");if(e&&e.code!=="declined")toast("저장하지 못했습니다. 백업 코드 복사를 이용해 주세요")}
  finally{if(btn)btn.disabled=false}
}
