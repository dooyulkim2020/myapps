<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#A0461E"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="맛집·카페"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"><link rel="apple-touch-icon" sizes="180x180" href="icon-180.png"><style>[hidden]{display:none!important}body{margin:0;background:#F3F4F6}</style></head><body>
<title>전국 맛집·카페</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* MY 미니앱 기본 체계 v1 — 폭 560 한 줄, 상단 고정 바(제목·가±), 카드 목록, 하단 고정 탭 4개 (맛집·카페·지도·내 목록) */
:root{
  --bg:#F3F4F6; --surface:#FFFFFF; --ink:#18202C; --muted:#5E6878; --line:#DCE0E6;
  --accent:#A0461E; --accent-soft:#F8EBE3; --ok:#2E7D4F; --warn:#9A6400; --warn-soft:#FFF4DC; --bad:#A23B2A; --bad-soft:#FBE9E5;
  --land:#ECEAE4; --land2:#F7DCCB; --sea:#E3ECF1; --stamp:#B3261E; --stamp-soft:#FBEAE8;
  --display:"Gowun Batang",Georgia,serif;
  --body:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111419; --surface:#1A1F27; --ink:#E8EBF0; --muted:#9BA4B3; --line:#2B313C;
  --accent:#F0A982; --accent-soft:#3A2619; --ok:#6FCB94; --warn:#E8B95A; --warn-soft:#3A2F17; --bad:#F0A08F; --bad-soft:#3A221D;
  --land:#262C36; --land2:#4A3022; --sea:#161B22; --stamp:#F28B82; --stamp-soft:#3B2020; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111419; --surface:#1A1F27; --ink:#E8EBF0; --muted:#9BA4B3; --line:#2B313C;
  --accent:#F0A982; --accent-soft:#3A2619; --ok:#6FCB94; --warn:#E8B95A; --warn-soft:#3A2F17; --bad:#F0A08F; --bad-soft:#3A221D;
  --land:#262C36; --land2:#4A3022; --sea:#161B22; --stamp:#F28B82; --stamp-soft:#3B2020; color-scheme:dark}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:16px/1.6 var(--body);padding-inline:16px;padding-block:0 96px;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4,p{margin:0}

.topbar{position:sticky;top:0;z-index:7;margin-inline:-16px;padding:8px 16px;padding-top:calc(8px + env(safe-area-inset-top,0px));background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;min-height:44px}
.tb-title{flex:1;min-width:0;font:700 17px/1.3 var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:14px;font-weight:500;background:var(--accent-soft);color:var(--accent);white-space:nowrap;font-variant-numeric:tabular-nums}
.save{flex:none;width:24px;height:38px;border:0;background:none;padding:0;display:grid;place-items:center;font-size:0;cursor:pointer}
.save::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--muted)}
.save[data-s="ok"]::before{background:var(--ok)}.save[data-s="local"]::before{background:var(--warn)}
.tb-font{flex:none;width:44px;height:38px;border:1px solid var(--line);background:var(--surface);border-radius:10px;font-weight:700;font-size:16px;cursor:pointer}
.tb-font small{font-size:11px}
html[data-fs]:not([data-fs="m"]) .tb-font{background:var(--accent);color:var(--surface);border-color:var(--accent)}
html[data-fs="s"] .wrap>main,html[data-fs="s"] .sheet{zoom:.88}
html[data-fs="l"] .wrap>main,html[data-fs="l"] .sheet{zoom:1.14}
html[data-fs="xl"] .wrap>main,html[data-fs="xl"] .sheet{zoom:1.28}
.fpop{position:absolute;right:12px;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.18);padding:8px;display:flex;flex-direction:column;gap:4px;min-width:160px;z-index:8}
.fpop p{margin:2px 6px 4px;font-size:13px;color:var(--muted)}
.fpop button{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:44px;padding:0 12px;border:1px solid transparent;border-radius:8px;background:transparent;cursor:pointer;text-align:left}
.fpop button small{color:var(--muted);font-size:13px}
.fpop button[aria-checked="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}

.dayhead{margin-block:16px 0}
.dayhead h2{font:700 21px/1.3 var(--display);text-wrap:balance}
.dayhead .meta{color:var(--muted);font-size:14px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-block:10px 2px;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent);padding-right:24px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.chip small{font-size:12.5px;opacity:.8;margin-left:2px}
.srch{display:flex;gap:8px;margin-top:12px}
.srch input{flex:1;min-width:0;font-size:16px;padding:8px 12px;min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.srch select{font-size:16px;min-height:44px;padding:0 8px;border:1px solid var(--line);border-radius:10px;background:var(--surface);max-width:40%}
.resline{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.tgl{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:14px;cursor:pointer}
.tgl[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}
.tl-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:22px 0 0}
.tl-h h3{font:700 17px/1.3 var(--display)}
.tl-h span{font-size:13.5px;color:var(--muted)}

.list{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.rc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.rc.saved{border-color:var(--accent)}
.rc-h{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.rc-t{min-width:0;flex:1;border:0;background:none;padding:0;text-align:left;cursor:pointer}
.rc-k{font-size:13px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:2px}
.rc-n{font-weight:600;font-size:17.5px;line-height:1.35;overflow-wrap:anywhere}
.rc-a{font-size:14px;color:var(--muted)}
.rc-d{margin-top:6px;font-size:15px;line-height:1.55;word-break:keep-all;overflow-wrap:anywhere}
.rc-m{margin:6px 0 0;display:flex;flex-direction:column;gap:2px;font-size:14px}
.rc-m div{display:grid;grid-template-columns:44px 1fr;gap:8px}
.rc-m dt{color:var(--muted);font-size:13px;padding-top:1px}
.rc-m dd{margin:0;min-width:0;overflow-wrap:anywhere}
.star{flex:none;min-width:62px;min-height:40px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;padding:0 8px}
.star[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.tagx{border-radius:4px;padding:0 6px;font-weight:600;font-size:12.5px;background:var(--bg);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tagx.ok{background:transparent;color:var(--ok);border-color:var(--ok)}
.tagx.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.tagx.old{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pc{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:3px;font-size:14.5px;line-height:1.5}
.pc li{display:grid;grid-template-columns:34px 1fr;gap:6px}
.pc .p{color:var(--ok);font-weight:700;font-size:13px;padding-top:1px}.pc .c{color:var(--warn);font-weight:700;font-size:13px;padding-top:1px}
.empty{margin-top:12px;padding:24px 14px;text-align:center;color:var(--muted);font-size:15px;background:var(--surface);border:1px dashed var(--line);border-radius:12px}
.more{width:100%;margin-top:10px}

section.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px}
section.box h3{margin:0 0 8px;font-size:15px;letter-spacing:.04em;color:var(--muted);font-weight:600}
.row{display:flex;justify-content:space-between;gap:10px;padding-block:8px;border-top:1px solid var(--line);align-items:baseline}
.row:first-of-type{border-top:0}
.row .l{min-width:0;color:var(--muted);font-size:14px;flex:none}
.row .r{text-align:right;font-weight:500;overflow-wrap:anywhere;min-width:0}
.note{margin-top:8px;font-size:14px;padding:8px 10px;border-radius:8px;line-height:1.55}
.note.tip{background:var(--accent-soft)}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.meta2{font-size:13.5px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-height:40px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:600}
.btn.line{background:var(--surface);border-color:var(--accent);color:var(--accent);font-weight:600}
.pick{position:relative;overflow:hidden}
.pick input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px}
.frow{display:flex;flex-wrap:wrap;gap:8px}
.frow>*{flex:1 1 140px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.fld input,.fld select{font-size:16px;padding:8px 10px;min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%;box-sizing:border-box}
.fld textarea{font-size:16px;padding:8px 10px;min-height:72px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%;box-sizing:border-box;resize:vertical}
.rate{display:flex;gap:6px;margin-top:4px}
.rate button{flex:1;min-height:42px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:15px;font-weight:600;color:var(--muted);cursor:pointer}
.rate button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 지도 */
.kmap{display:block;width:100%;height:auto;background:var(--sea);border:1px solid var(--line);border-radius:12px;margin-top:12px}
.kmap .sd{fill:var(--land);stroke:var(--surface);stroke-width:1.2;stroke-linejoin:round}
.kmap .sd.on{fill:var(--land2)}
.kmap .dot{fill:var(--accent);opacity:.55}
.kmap .bub{cursor:pointer}
.kmap .bub circle{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.kmap .bub.on circle{fill:var(--accent)}
.kmap .bub .n{font:700 14px var(--body);fill:var(--accent)}
.kmap .bub.on .n{fill:var(--surface)}
.kmap .bub .t{font:600 12.5px var(--body);fill:var(--ink);paint-order:stroke;stroke:var(--sea);stroke-width:4px;stroke-linejoin:round}
.rtab{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
.rtab th{font-size:13px;color:var(--muted);font-weight:500;text-align:left;padding:4px 0;border-bottom:1px solid var(--line)}
.rtab td{padding:9px 0;border-bottom:1px solid var(--line)}
.rtab tr[data-reg]{cursor:pointer}
.rtab .n{text-align:right;white-space:nowrap}
.rtab tr.on td{color:var(--accent);font-weight:600}

.why{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:14.5px;line-height:1.5}
.why li{display:grid;grid-template-columns:20px 1fr;gap:6px;word-break:keep-all;overflow-wrap:anywhere}
.why li b{width:20px;height:20px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:12px;display:grid;place-items:center;margin-top:1px}
.tg{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}.tg span{font-size:12.5px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.chips.sm{padding-top:6px}.chips.sm .chip{min-height:36px;padding:6px 12px;font-size:13.5px}
.tagx.stp{background:transparent;color:var(--stamp);border:1.5px solid var(--stamp);border-radius:999px;transform:rotate(-4deg)}
.rc.done{border-color:var(--stamp)}
.kv{padding:8px 0;border-top:1px solid var(--line)}.kv:first-of-type{border-top:0}.kv span{font-size:13px;color:var(--muted)}.kv p{font-size:15px;line-height:1.55;word-break:keep-all}
.stamped{display:flex;gap:12px;align-items:center;margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--stamp-soft)}
.seal{flex:none;width:52px;height:52px;border-radius:50%;border:3px solid var(--stamp);color:var(--stamp);display:grid;place-items:center;font:700 15px var(--display);transform:rotate(-10deg)}
.stampbtn{font-weight:700}.btn.pri.stampbtn{background:var(--stamp);border-color:var(--stamp)}.stampbtn.done{background:var(--stamp-soft);border-color:var(--stamp);color:var(--stamp)}
.prog{display:flex;gap:14px;align-items:center}.ring{width:100px;height:100px;flex:none}.ring .bg{fill:none;stroke:var(--line);stroke-width:9}
.ring .fg{fill:none;stroke:var(--stamp);stroke-width:9;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
.ring .rn{font:700 26px var(--body);fill:var(--ink)}.ring .rd{font:500 12px var(--body);fill:var(--muted)}
.gt{font:700 20px/1.3 var(--display);color:var(--stamp);margin:2px 0}
.bar{height:8px;border-radius:99px;background:var(--line);margin:8px 0 4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--stamp);border-radius:99px}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bdg{border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center;min-width:0}
.bdg .ic{width:46px;height:46px;margin:0 auto 6px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font:600 12.5px var(--body);color:var(--muted)}
.bdg.on{background:var(--stamp-soft);border-color:transparent}.bdg.on .ic{border:3px solid var(--stamp);color:var(--stamp);font:700 13px var(--display);transform:rotate(-10deg)}
.bdg b{display:block;font-size:13.5px;font-weight:600;word-break:keep-all}.bdg small{display:block;font-size:12px;color:var(--muted);word-break:keep-all}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.st{aspect-ratio:1;min-width:0;border-radius:50%;border:2px dashed var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;cursor:pointer;text-align:center;line-height:1.2;color:var(--muted);word-break:keep-all;overflow:hidden}
.st .nm{font-size:12.5px;font-weight:600;color:var(--ink)}.st .d{font-size:11px;margin-top:2px}
.st.cf{border-color:#CDB9A6}
.st.on{border:3px solid var(--stamp);background:var(--stamp-soft);transform:rotate(-7deg)}.st.on .nm,.st.on .d{color:var(--stamp)}
.kmap .dot.v{fill:var(--stamp);opacity:.9}
.kmap .bub.has circle{stroke:var(--stamp)}.kmap .bub .n{font:700 12px var(--body)}
.stampfx{position:fixed;inset:0;z-index:50;display:grid;place-items:center;pointer-events:none;background:rgba(10,14,20,.18)}
.stampfx .s{width:190px;height:190px;border-radius:50%;border:8px double var(--stamp);color:var(--stamp);display:flex;flex-direction:column;align-items:center;justify-content:center;font:700 34px/1.2 var(--display);background:var(--surface);transform:rotate(-12deg);animation:stp .45s cubic-bezier(.2,1.5,.4,1) both}
.stampfx .s small{font:600 14px/1.3 var(--body);margin-top:6px;max-width:150px;text-align:center;word-break:keep-all}
@keyframes stp{0%{transform:scale(2.4) rotate(-12deg);opacity:0}100%{transform:scale(1) rotate(-12deg);opacity:1}}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
nav.tabs button{border:0;background:transparent;border-radius:10px;min-height:50px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12.5px;color:var(--muted);cursor:pointer}
nav.tabs button b{font-size:16px;font-weight:600;color:var(--ink)}
nav.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
nav.tabs button[aria-selected="true"] b{color:var(--accent)}

.sheetBg{position:fixed;inset:0;z-index:20;background:rgba(10,14,20,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;background:var(--bg);border-radius:16px 16px 0 0;padding:0 16px}
.shead{position:sticky;top:0;z-index:2;margin-inline:-16px;padding:8px 16px 12px;background:var(--bg);border-bottom:1px solid var(--line)}
.grab{width:40px;height:5px;margin:0 auto 8px;border-radius:99px;background:var(--line)}
.shead .hd{display:flex;justify-content:space-between;align-items:center;gap:10px}
.shead h2{font:700 21px/1.3 var(--display);min-width:0;overflow-wrap:anywhere}
.shead .sub{font-size:14px;color:var(--muted);margin-top:2px}
.x{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:16px;cursor:pointer}
.sact{position:sticky;bottom:0;z-index:2;margin-inline:-16px;margin-top:12px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sact .btn{min-height:46px;font-size:15px}
.toast{position:fixed;left:50%;bottom:calc(74px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;max-width:calc(100vw - 32px);padding:10px 16px;border-radius:10px;background:var(--ink);color:var(--surface);font-size:14px;font-weight:500;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <div class="topbar">
    <div class="tb-title">전국 맛집·카페</div>
    <span class="pill" id="tbPill">도장 0</span>
    <button class="save" type="button" id="saveState" data-s="local" aria-label="저장 상태">저장 상태</button>
    <button class="tb-font" id="fontBtn" type="button" aria-haspopup="true" aria-expanded="false" aria-label="글자 크기">가<small>±</small></button>
    <div class="fpop" id="fontPop" hidden role="menu"><p>글자 크기</p>
      <button type="button" role="menuitemradio" data-fs="s"><span style="font-size:13px">작게</span><small>88%</small></button>
      <button type="button" role="menuitemradio" data-fs="m"><span style="font-size:15px">보통</span><small>100%</small></button>
      <button type="button" role="menuitemradio" data-fs="l"><span style="font-size:17px">크게</span><small>114%</small></button>
      <button type="button" role="menuitemradio" data-fs="xl"><span style="font-size:19px">아주 크게</span><small>128%</small></button></div>

  $("vMine").innerHTML=h}
function render(){document.querySelectorAll("nav.tabs [data-view]").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.view===state.view)));
  ["food","cafe","stamp","mine"].forEach(v=>{$("v"+v[0].toUpperCase()+v.slice(1)).hidden=state.view!==v});
  const P=all(),nv=P.filter(p=>mk(p.id).visited).length;$("tFood").textContent=`${P.filter(p=>p.t==="food").length}곳`;$("tCafe").textContent=`${P.filter(p=>p.t==="cafe").length}곳`;
  $("tMine").textContent=`저장 ${P.filter(p=>mk(p.id).saved&&!mk(p.id).visited).length}`;$("tStamp").textContent=`${nv} / ${P.length}`;$("tbPill").textContent=`도장 ${nv}`;
  const ae=document.activeElement,keep=ae&&ae.id==="q"?[ae.selectionStart]:null;
  if(state.view==="food"||state.view==="cafe")renderList(state.view);else if(state.view==="stamp")renderStamp();else renderMine();
  if(keep){const i=$("q");if(i){i.focus();try{i.setSelectionRange(keep[0],keep[0])}catch(e){}}}
  if(!$("sheetBg").hidden&&openId&&$("sheet").dataset.kind==="place")openPlace(openId,true)}

/* ── 자세히 ── */
let openId=null;
function sheet(title,sub,body,acts,kind){const sc=$("sheet").scrollTop;$("sheet").dataset.kind=kind||"";$("sheet").innerHTML=`<div class="shead"><div class="grab"></div><div class="hd"><div style="min-width:0"><h2>${title}</h2>${sub?`<div class="sub">${sub}</div>`:""}</div><button class="x" type="button" data-close="1" aria-label="닫기">✕</button></div></div>${body}${acts?`<div class="sact">${acts}</div>`:""}`;
  const was=!$("sheetBg").hidden;$("sheetBg").hidden=false;$("sheet").scrollTop=was&&kind==="place"?sc:0;if(!was)pushHist()}
function closeSheet(){$("sheetBg").hidden=true;openId=null}
function openPlace(id,keep){const p=byId(id);if(!p)return;const pm=keep&&$("memo")?$("memo").value:null;openId=id;const m=mk(id);
  const info=[["종류",esc(p.cat)],["대표 메뉴",esc(p.sig)],["가격",esc(p.price)],["개업",p.since?`${p.since}년 (${new Date().getFullYear()-p.since}년째)`:""],["선정·근거",esc(p.badge)],["위치",esc([p.city,p.area].filter(Boolean).join(" · "))]].filter(x=>x[1]);
  const before=[["분위기·좌석",p.mood],["대기·예약",p.wait],["교통·주차",p.go],["추천 시기",p.season],["이런 분께",p.who]].filter(x=>x[1]);
  sheet(esc(p.name),esc([p.reg,p.city,p.cat].filter(Boolean).join(" · ")),`
    ${m.visited?`<div class="stamped"><span class="seal">도장</span><span><b>${esc(m.date||"")}에 다녀왔습니다</b><br><span class="meta2">${m.rating?"별점 "+"★".repeat(m.rating):"별점을 남겨 보세요"}</span></span></div>`:""}
    ${p.desc?`<p style="margin-top:12px;font-size:15.5px;line-height:1.65;word-break:keep-all">${esc(p.desc)}</p>`:""}
    ${(p.why||[]).length?`<section class="box"><h3>추천 이유</h3>${whyList(p,9)}</section>`:""}
    ${(p.menu||[]).length?`<section class="box"><h3>추천 메뉴</h3>${p.menu.map(x=>`<div class="row"><span class="l" style="color:var(--ink);font-size:15px;font-weight:600">${esc(x[0])}</span><span class="r" style="font-weight:400;font-size:14px;color:var(--muted)">${esc(x[1]||"")}</span></div>`).join("")}</section>`:""}
    ${(p.pros||[]).length||(p.cons||[]).length?`<section class="box"><h3>장점과 주의할 점</h3>${pcList(p,9,9)}</section>`:""}
    ${before.length?`<section class="box"><h3>가기 전에</h3>${before.map(x=>`<div class="kv"><span>${x[0]}</span><p>${esc(x[1])}</p></div>`).join("")}</section>`:""}
    ${p.tip?`<p class="note tip">${esc(p.tip)}</p>`:""}
    ${p.near?`<section class="box"><h3>함께 가볼 곳</h3><p style="font-size:15px">${esc(p.near)}</p></section>`:""}
    ${info.length?`<section class="box"><h3>기본 정보</h3>${info.map(x=>`<div class="row"><span class="l">${x[0]}</span><span class="r">${x[1]}</span></div>`).join("")}${(p.tags||[]).length?`<div class="tg" style="margin-top:8px">${p.tags.map(x=>`<span>${esc(x)}</span>`).join("")}</div>`:""}</section>`:""}
    <section class="box"><h3>우리 기록</h3><button class="btn ${m.saved?"pri":"line"}" type="button" data-star="${id}" style="width:100%">${m.saved?"가 보고 싶은 곳에 저장됨":"가 보고 싶은 곳에 저장"}</button>
      ${m.visited?`<label class="fld" style="margin-top:10px">다녀온 날<input type="date" id="vdate" value="${esc(m.date||"")}"></label><div class="fld" style="margin-top:10px">별점<div class="rate">${[1,2,3,4,5].map(n=>`<button type="button" data-rate="${n}" aria-pressed="${m.rating===n}">${n}</button>`).join("")}</div></div>`:""}
      <label class="fld" style="margin-top:10px">메모 (맛·가격·대기 시간 등)<textarea id="memo" maxlength="300">${esc(m.memo||"")}</textarea></label><button class="btn" type="button" data-memo="${id}" style="margin-top:8px;width:100%">메모 저장</button>
      ${m.visited?`<button class="btn" type="button" data-unstamp="${id}" style="margin-top:8px;width:100%;color:var(--muted)">도장 지우기</button>`:""}
      ${p.custom?`<button class="btn" type="button" data-delc="${id}" style="margin-top:8px;width:100%;color:var(--bad)">이 가게 목록에서 빼기</button>`:""}</section>
    <p class="meta2" style="margin-top:10px">영업시간·휴무는 지도 앱에서 확인하세요. <a href="${kakao(p)}" target="_blank" rel="noopener" style="color:var(--accent);font-weight:600">카카오맵에서 보기</a></p>`,
    `<a class="btn line" href="${naver(p)}" target="_blank" rel="noopener">네이버 지도</a>${m.visited?`<button class="btn stampbtn done" type="button" data-stamp="${id}">도장 찍음 ${esc((m.date||"").slice(5).replace("-","/"))}</button>`:`<button class="btn pri stampbtn" type="button" data-stamp="${id}">도장 찍기</button>`}`,"place");if(pm!=null)$("memo").value=pm}
function stampFx(name){const e=document.createElement("div");e.className="stampfx";e.innerHTML=`<div class="s">맛 도장<small>${esc(name)}</small></div>`;document.body.appendChild(e);setTimeout(()=>e.remove(),1100)}
function doStamp(id){const p=byId(id),m=mk(id);if(m.visited){toast(`${m.date||""}에 이미 도장을 찍었습니다`);return}
  const before=badgeState(all().filter(x=>mk(x.id).visited)).filter(b=>b.on).map(b=>b.k);
  putMark(id,{visited:true,date:m.date||today()});stampFx(p?p.name:"");
  const now=badgeState(all().filter(x=>mk(x.id).visited));const nb=now.filter(b=>b.on&&!before.includes(b.k));const n=all().filter(x=>mk(x.id).visited).length;
  setTimeout(()=>toast(nb.length?`새 배지: ${nb.map(b=>b.n).join(", ")}`:`도장 ${n}개째! 별점과 메모도 남겨 보세요`),900)}
function openAdd(){sheet("새 가게 추가","",`<div style="margin-top:12px;display:flex;flex-direction:column;gap:10px">
  <label class="fld">가게 이름<input id="aName" maxlength="40" autocomplete="off"></label>
  <div class="frow"><label class="fld">구분<select id="aT"><option value="food">맛집</option><option value="cafe">카페·빵집</option></select></label><label class="fld">권역<select id="aReg">${REGS.map(r=>`<option>${r}</option>`).join("")}</select></label></div>
  <div class="frow"><label class="fld">도시·동네<input id="aCity" maxlength="30" placeholder="예: 강릉 초당동"></label><label class="fld">대표 메뉴<input id="aSig" maxlength="40"></label></div>
  <label class="fld">메모<textarea id="aMemo" maxlength="300"></textarea></label></div>`,`<button class="btn" type="button" data-close="1">취소</button><button class="btn pri" type="button" id="addDo">추가</button>`)}
let tt=null;function toast(t){const e=$("toast");e.textContent=t;e.hidden=false;clearTimeout(tt);tt=setTimeout(()=>e.hidden=true,2400)}
let hist=false;function pushHist(){if(!hist){try{history.pushState({f:1},"");hist=true}catch(e){}}}
addEventListener("popstate",()=>{hist=false;if(!$("sheetBg").hidden)closeSheet()});
function back(){if(hist){history.back()}else closeSheet()}

/* ── 백업 ── */
const APPN="전국 맛집·카페";
const backup=()=>JSON.stringify({app:APPN,v:1,exportedAt:new Date().toISOString(),marks:state.marks,custom:state.custom},null,1);
function restore(txt){let o;try{o=JSON.parse(txt)}catch(e){toast("백업 코드를 읽지 못했습니다");return}if(!o||o.app!==APPN||!o.marks){toast("이 앱의 백업이 아닙니다");return}
  let n=0;[["marks",state.marks],["custom",state.custom]].forEach(([col,box])=>Object.values(o[col]||{}).forEach(r=>{if(r&&r.id&&ts(r)>ts(box[r.id])){box[r.id]=r;enq(col+"/"+r.id);n++}}));lsSave();render();toast(n?`${n}건을 복원했습니다`:"이미 최신이라 바뀐 것이 없습니다")}
async function saveFile(){let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null}catch(e){}const name=`MY미니앱_맛집카페_백업_${today().replace(/-/g,"")}.json`;
  try{if(dl){await dl.save({filename:name,data:new Blob([backup()],{type:"application/json"})})}else{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([backup()],{type:"application/json"}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}toast("백업 파일을 저장했습니다")}
  catch(e){if(e&&e.code==="declined")return;copyBk()}}
async function copyBk(){try{await navigator.clipboard.writeText(backup());toast("백업 코드를 복사했습니다")}catch(e){sheet("백업 코드","",`<label class="fld" style="margin-top:12px">아래 글을 모두 선택해 복사하세요<textarea style="min-height:200px">${esc(backup())}</textarea></label>`,`<button class="btn" type="button" data-close="1">닫기</button><span></span>`)}}

/* ── 글자 크기 ── */
let fs="m";try{fs=localStorage.getItem("myapps-fs")||"m"}catch(e){}
function applyFs(){document.documentElement.dataset.fs=fs;document.querySelectorAll("#fontPop [data-fs]").forEach(b=>b.setAttribute("aria-checked",String(b.dataset.fs===fs)));try{localStorage.setItem("myapps-fs",fs)}catch(e){}}
applyFs();

/* ── 이벤트 ── */
document.addEventListener("click",e=>{const g=e.target.closest("[data-mreg],tr[data-reg],.row[data-open]");
  if(g&&!e.target.closest("button,a")){if(g.dataset.mreg||g.tagName==="TR"){state.mreg=g.dataset.mreg||g.dataset.reg;render();return}if(g.dataset.open){openPlace(g.dataset.open);return}}
  const t=e.target.closest("button,a,label");if(!t){if(e.target.id==="sheetBg")back();if(!e.target.closest("#fontPop,#fontBtn"))$("fontPop").hidden=true;return}
  const d=t.dataset,v=state.view;
  if(t.id==="fontBtn"){const p=$("fontPop");p.hidden=!p.hidden;t.setAttribute("aria-expanded",String(!p.hidden));return}
  if(d.fs){fs=d.fs;applyFs();$("fontPop").hidden=true;if(db&&window.__prefDoc)db.doc(window.__prefDoc).set({fs,updatedAt:Date.now()}).catch(()=>{});return}
  if(!t.closest("#fontPop"))$("fontPop").hidden=true;
  if(d.view){state.view=d.view;state.limit=30;try{localStorage.setItem("myapps-kfood-view",d.view)}catch(_){}render();scrollTo({top:0});return}
  if(d.reg!=null&&t.classList.contains("chip")){state.reg[v]=d.reg;state.limit=30;render();return}
  if(d.tg){state[d.tg][v]=!state[d.tg][v];state.limit=30;render();return}
  if(d.tag!=null&&t.classList.contains("chip")){state.tag[v]=d.tag;state.limit=30;render();return}
  if(d.mreg&&t.classList.contains("chip")){state.mreg=d.mreg;render();return}
  if(d.stamp){doStamp(d.stamp);return}
  if(d.unstamp){if(confirm("이 가게의 도장을 지울까요? 별점·메모는 남습니다.")){putMark(d.unstamp,{visited:false});toast("도장을 지웠습니다")}return}
  if(t.id==="moreBtn"){state.limit+=30;render();return}
  if(t.id==="resetF"){state.reg[v]="";state.cat[v]="";state.q[v]="";state.old[v]=false;state.saved[v]=false;state.nost[v]=false;state.tag[v]="";render();return}
  if(d.open){openPlace(d.open);return}
  if(d.star){const m=mk(d.star);putMark(d.star,{saved:!m.saved});toast(m.saved?"저장을 뺐습니다":"저장했습니다 · 내 목록에서 봅니다");return}
    if(d.rate){putMark(openId,{rating:+d.rate});return}
  if(d.memo){const dt=$("vdate");putMark(d.memo,{memo:$("memo").value.trim().slice(0,300),...(dt&&dt.value?{date:dt.value}:{})});toast("메모를 저장했습니다");return}
  if(d.delc){const c=state.custom[d.delc];if(c&&confirm("이 가게를 목록에서 뺄까요?")){putCustom({...c,deleted:true});back();toast("목록에서 뺐습니다")}return}
  if(t.id==="addBtn"){openAdd();return}
  if(t.id==="addDo"){const n=$("aName").value.trim();if(!n){toast("가게 이름을 넣어 주세요");return}const id="u"+Date.now().toString(36);
    putCustom({id,name:n.slice(0,40),t:$("aT").value,reg:$("aReg").value,city:$("aCity").value.trim().slice(0,30),sig:$("aSig").value.trim().slice(0,40),memo:$("aMemo").value.trim().slice(0,300),cat:"우리가 추가",deleted:false});back();toast("추가했습니다");return}
  if(t.id==="bkSave"){saveFile();return}
  if(t.id==="bkCopy"){copyBk();return}
  if(t.id==="bkPaste"){sheet("붙여넣어 복원","",`<label class="fld" style="margin-top:12px">백업 코드를 붙여넣으세요 (기존 기록과 합칩니다)<textarea id="bkText" style="min-height:160px"></textarea></label>`,`<button class="btn" type="button" data-close="1">취소</button><button class="btn pri" type="button" id="bkDo">복원</button>`);return}
  if(t.id==="bkDo"){restore($("bkText").value);back();return}
  if(d.close){back();return}
});
document.addEventListener("input",e=>{if(e.target.id==="q"){state.q[state.view]=e.target.value;state.limit=30;render()}});
document.addEventListener("change",e=>{const t=e.target;if(t.id==="catSel"){state.cat[state.view]=t.value;state.limit=30;render()}if(t.id==="vdate"&&openId&&t.value){putMark(openId,{date:t.value})}if(t.id==="bkFile"&&t.files[0]){t.files[0].text().then(restore);t.value=""}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("sheetBg").hidden)back();if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches(".bub")){e.preventDefault();state.mreg=e.target.dataset.mreg;render()}});
render();
})();
</script>
