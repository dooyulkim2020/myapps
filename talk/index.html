<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#A4472F"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="MY 회화"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"><link rel="apple-touch-icon" sizes="180x180" href="icon-180.png"><style>[hidden]{display:none!important}body{margin:0;background:#F3F4F6}</style></head><body>
<title>MY 회화</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* 레이아웃: MY 미니앱 기본 체계 v1 — 폭 560 한 줄, 상단 고정 바(제목·가±), 카드 목록, 하단 고정 탭 3개 (듣기·문장·설정) */
:root{
  --bg:#F3F4F6; --surface:#FFFFFF; --ink:#18202C; --muted:#5E6878; --line:#DCE0E6;
  --accent:#A4472F; --accent-soft:#F7E9E4; --ok:#2E7D4F; --warn:#9A6400; --warn-soft:#FFF4DC; --bad:#A23B2A; --bad-soft:#FBE9E5;
  --display:"Gowun Batang",Georgia,serif;
  --body:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111419; --surface:#1A1F27; --ink:#E8EBF0; --muted:#9BA4B3; --line:#2B313C;
  --accent:#EBA58F; --accent-soft:#3A2620; --ok:#6FCB94; --warn:#E8B95A; --warn-soft:#3A2F17; --bad:#F0A08F; --bad-soft:#3A221D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111419; --surface:#1A1F27; --ink:#E8EBF0; --muted:#9BA4B3; --line:#2B313C;
  --accent:#EBA58F; --accent-soft:#3A2620; --ok:#6FCB94; --warn:#E8B95A; --warn-soft:#3A2F17; --bad:#F0A08F; --bad-soft:#3A221D; color-scheme:dark}
html,body{background:var(--bg)}
body{color:var(--ink);font:16px/1.6 var(--body);padding-inline:16px;padding-block:0 96px;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4,p{margin:0}

/* 상단 고정 바 */
.topbar{position:sticky;top:0;z-index:7;margin-inline:-16px;padding:8px 16px;padding-top:calc(8px + env(safe-area-inset-top,0px));background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;min-height:44px}
.tb-title{flex:1;min-width:0;font:700 17px/1.3 var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:14px;font-weight:500;background:var(--accent-soft);color:var(--accent);white-space:nowrap;font-variant-numeric:tabular-nums}
.save{flex:none;width:24px;height:38px;border:0;background:none;padding:0;display:grid;place-items:center;font-size:0;cursor:pointer}
.save::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--muted)}
.save[data-s="ok"]::before{background:var(--ok)}.save[data-s="local"]::before{background:var(--warn)}
.tb-font{flex:none;width:44px;height:38px;border:1px solid var(--line);background:var(--surface);border-radius:10px;font-weight:700;font-size:16px;cursor:pointer}
.tb-font small{font-size:11px}
.tb-home{flex:none;display:grid;place-items:center;width:44px;height:38px;border:1px solid var(--line);background:var(--surface);border-radius:10px;font-weight:700;font-size:14px;text-decoration:none;color:var(--accent)}
.tb-home[hidden]{display:none}
html[data-fs]:not([data-fs="m"]) .tb-font{background:var(--accent);color:var(--surface);border-color:var(--accent)}
html[data-fs="s"] .wrap>main,html[data-fs="s"] .sheet{zoom:.88}
html[data-fs="l"] .wrap>main,html[data-fs="l"] .sheet{zoom:1.14}
html[data-fs="xl"] .wrap>main,html[data-fs="xl"] .sheet{zoom:1.28}
.fpop{position:absolute;right:12px;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.18);padding:8px;display:flex;flex-direction:column;gap:4px;min-width:160px;z-index:8}
.fpop[hidden]{display:none}
.fpop p{margin:2px 6px 4px;font-size:13px;color:var(--muted)}
.fpop button{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:44px;padding:0 12px;border:1px solid transparent;border-radius:8px;background:transparent;cursor:pointer;text-align:left}
.fpop button small{color:var(--muted);font-size:13px}
.fpop button[aria-checked="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}

/* 머리 */
.dayhead{margin-block:16px 0}
.dayhead h2{font:700 21px/1.3 var(--display);text-wrap:balance}
.dayhead .meta{color:var(--muted);font-size:14px}
.grp{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;margin-top:12px}
.grp button{border:0;background:transparent;border-radius:9px;min-height:48px;padding:4px 2px;font-size:16px;font-weight:600;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}
.grp button small{font-size:12px;font-weight:400}
.grp button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-block:12px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.tl-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:20px 0 0}
.tl-h h3{font-size:15px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.tl-h span{font-size:13.5px;color:var(--muted)}

/* 요약 */
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px}
.kpi .big{font:600 28px/1.25 var(--body);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .big small{font-size:16px;font-weight:500;color:var(--muted);margin-left:2px}
.kpi .sub{font-size:14px;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.bar{display:grid;grid-template-columns:64px 1fr auto;gap:8px;align-items:center;font-size:14px}
.bar .trk{height:10px;border-radius:99px;background:var(--bg);overflow:hidden}
.bar .fil{height:100%;border-radius:99px;background:var(--accent)}
.bar b{font-weight:600;font-variant-numeric:tabular-nums}

/* 카드 목록 */
.list{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.card{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;color:inherit;min-width:0;width:100%;text-align:left;font:inherit;cursor:pointer}
.card:active{background:var(--accent-soft)}
.card.off{opacity:.62}
.mono{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff;font:700 18px/1 var(--display);flex:none}
.mono.sm{width:32px;height:32px;border-radius:9px;font-size:14px}
.card .nm{font-weight:600;font-size:17.5px;line-height:1.35;overflow-wrap:anywhere}
.card .ds{font-size:14px;color:var(--muted);line-height:1.5}
.card .mt{font-size:13px;color:var(--muted);margin-top:4px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.card .amt{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.card .amt small{display:block;font-weight:400;font-size:13px;color:var(--muted)}
.pinfo{grid-column:1/-1;display:flex;flex-direction:column;gap:3px;border-top:1px dashed var(--line);padding-top:8px;font-size:14px;line-height:1.45}
.pi{display:grid;grid-template-columns:64px 1fr;gap:8px}
.pi .k{color:var(--muted);font-size:13px;padding-top:1px}
.pi .v{min-width:0;overflow-wrap:anywhere}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tagx{border-radius:4px;padding:0 6px;font-weight:600;font-size:12.5px;background:var(--bg);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tagx.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.tagx.ok{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.tagx.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.empty{margin-top:12px;padding:24px 14px;text-align:center;color:var(--muted);font-size:15px;background:var(--surface);border:1px dashed var(--line);border-radius:12px}
.empty .btn{margin-top:10px}

/* 상자 */
section.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px}
section.box h3{margin:0 0 8px;font-size:15px;letter-spacing:.04em;color:var(--muted);font-weight:600}
.row{display:flex;justify-content:space-between;gap:10px;padding-block:8px;border-top:1px solid var(--line);align-items:baseline}
.row:first-of-type{border-top:0}
.row .l{min-width:0}
.row .l small{display:block;color:var(--muted);font-size:13px}
.row .r{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.ol li::marker{color:var(--accent);font-weight:600}
.note{margin-top:8px;font-size:14px;padding:8px 10px;border-radius:8px}
.note.tip{background:var(--accent-soft)}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.meta2{font-size:13.5px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-height:40px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:600}
.btn.line{background:var(--surface);border-color:var(--accent);color:var(--accent);font-weight:600}
.btn.sm{min-height:34px;padding:4px 10px;font-size:13.5px}
.btn:disabled{opacity:.5;cursor:default}
.pick{position:relative;overflow:hidden}
.pick input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px}
.pick.busy{opacity:.5;pointer-events:none}
.btn.danger{background:var(--surface);border-color:var(--bad);color:var(--bad);font-weight:600}
.sact.three{grid-template-columns:1fr 1fr 2fr}
.toast .undo{margin-left:10px;min-height:34px;padding:2px 12px;border-radius:8px;border:1px solid var(--surface);background:transparent;color:var(--surface);font-weight:600;cursor:pointer}
.frow{display:flex;flex-wrap:wrap;gap:8px}
.frow>.fld{flex:1 1 140px}
.vstack{display:flex;flex-direction:column;gap:10px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.fld input,.fld select,.fld textarea{font-size:16px;padding:8px 10px;min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%;box-sizing:border-box}
.fld textarea{min-height:72px;resize:vertical}
.fld .ck{display:flex;align-items:center;gap:8px;min-height:44px;font-size:16px;color:var(--ink)}
.fld .ck input{width:22px;height:22px;min-height:0}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:40px;height:40px;border-radius:10px;border:2px solid transparent;cursor:pointer}
.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--surface) inset}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{min-height:40px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* 보장 표 */
.mx{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.mxw{overflow-x:auto;margin-inline:-14px;padding-inline:14px}
.mx th,.mx td{padding:7px 6px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
.mx th:first-child,.mx td:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
.mx thead th{border-top:0;color:var(--muted);font-weight:600;font-size:13px}
.mx td.no{color:var(--bad);font-weight:600}
.mx td.yes{font-weight:600}

/* 일정 */
.ev{display:grid;grid-template-columns:58px 1fr;gap:10px;padding-block:9px;border-top:1px solid var(--line);align-items:center}
.ev:first-child{border-top:0}
.ev .dd{text-align:center;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:14px;padding:4px 0;font-variant-numeric:tabular-nums}
.ev .dd.soon{background:var(--warn-soft);color:var(--warn)}
.ev b{font-weight:600;font-size:15px;display:block}
.ev small{font-size:13px;color:var(--muted)}

/* 보험 분석 */
.rvrow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;width:100%;min-height:48px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font:inherit;text-align:left;cursor:pointer;font-variant-numeric:tabular-nums}
.rvrow[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.rvrow b{font-weight:600;font-size:17px}
.rvrow small{display:block;font-size:13px;color:var(--muted)}
.up{color:var(--ok);font-size:13px;font-weight:600}.down{color:var(--bad);font-size:13px;font-weight:600}
.score{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.score .big{font:600 34px/1.1 var(--body);font-variant-numeric:tabular-nums}
.score .big small{font-size:16px;color:var(--muted);font-weight:500}
.gl{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:10px;font-size:15px}
.gl li::marker{color:var(--accent);font-weight:700}
.gl b{display:block;font-weight:600}
.ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:15px}
/* 보장 입력 줄 */
.cov{border:1px solid var(--line);border-radius:10px;padding:8px;display:grid;grid-template-columns:1fr 112px 40px;gap:6px;background:var(--surface)}
.cov .full{grid-column:1/-1}
.cov select,.cov input{font-size:16px;padding:6px 8px;min-height:42px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%;box-sizing:border-box;min-width:0}
.cov .x{width:40px;height:42px;border-radius:8px}
.files{display:flex;flex-direction:column;gap:6px}
.fvpage{width:100%;height:auto;display:block;background:#fff;border:1px solid var(--line);border-radius:8px}
.file{display:flex;align-items:center;gap:8px;justify-content:space-between;border:1px solid var(--line);border-radius:8px;padding:6px 8px 6px 12px;background:var(--surface);font-size:14px}
.file a{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1;min-height:34px;display:flex;align-items:center}

/* 하단 탭 */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
nav.tabs button{border:0;background:transparent;border-radius:10px;min-height:50px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12.5px;color:var(--muted);cursor:pointer}
nav.tabs button b{font-size:16px;font-weight:600;color:var(--ink)}
nav.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
nav.tabs button[aria-selected="true"] b{color:var(--accent)}

/* 아래에서 올라오는 창 */
.sheetBg{position:fixed;inset:0;z-index:20;background:rgba(10,14,20,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;background:var(--bg);border-radius:16px 16px 0 0;padding:0 16px}
.shead{position:sticky;top:0;z-index:2;margin-inline:-16px;padding:8px 16px 12px;background:var(--bg);border-bottom:1px solid var(--line)}
.grab{width:40px;height:5px;margin:0 auto 8px;border-radius:99px;background:var(--line)}
.shead .hd{display:flex;justify-content:space-between;align-items:center;gap:10px}
.shead h2{font:700 21px/1.3 var(--display);min-width:0;overflow-wrap:anywhere}
.x{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:16px;cursor:pointer}
.sact{position:sticky;bottom:0;z-index:2;margin-inline:-16px;margin-top:12px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 2fr;gap:8px}
.sact .btn{min-height:46px;font-size:15px}
.toast{position:fixed;left:50%;bottom:calc(74px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;max-width:calc(100vw - 32px);padding:10px 16px;border-radius:10px;background:var(--ink);color:var(--surface);font-size:14px;font-weight:500;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<style>
/* MY 회화 전용 */
.langs{display:flex;gap:6px;overflow-x:auto;padding-block:12px 2px;scrollbar-width:none}
.langs::-webkit-scrollbar{display:none}
.chip[disabled]{opacity:.55;cursor:default}
.chip small{font-size:12px;opacity:.75;margin-left:4px}
.player{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px;position:relative}
.prog{display:flex;gap:3px;margin-bottom:6px}
.prog i{flex:1;height:5px;border-radius:99px;background:var(--line)}
.prog i.done{background:var(--accent-soft)}
.prog i.on{flex:1.8;background:var(--accent)}
.pmeta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.ln{border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:8px;transition:background .2s,border-color .2s}
.ln .lb{font-size:13px;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;gap:8px}
.ln.ko .tx{font-size:19px;font-weight:600;line-height:1.45;margin-top:2px}
.ln.tg .tx{font:700 28px/1.35 var(--body);margin-top:4px;word-break:keep-all;overflow-wrap:anywhere}
.ln .rd{font-size:16px;color:var(--muted);margin-top:6px}
.ln.speak{background:var(--accent-soft);border-color:var(--accent)}
.reps{display:flex;gap:4px;margin-top:10px}.reps i{flex:1;height:4px;border-radius:99px;background:var(--line)}.reps i.on{background:var(--accent)}
.status{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px;color:var(--muted);min-height:22px}
.status .dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.status .dot.on{background:var(--ok)}
.ctl{display:grid;grid-template-columns:1fr 2fr 1fr;gap:8px;margin-top:12px}
.ctl .btn{min-height:56px;font-size:16px;border-radius:999px}
.ctl .play{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;font-size:18px}
.ctl .play.stop{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.star{border:0;background:none;font-size:24px;line-height:1;cursor:pointer;color:var(--muted);min-width:44px;min-height:44px}
.star[aria-pressed="true"]{color:#E0A100}
.awake{font-size:13px;padding:6px 10px;border-radius:999px;background:var(--bg);display:inline-flex;gap:6px;align-items:center}
.awake.on{background:var(--accent-soft);color:var(--ok)}
.opt{margin-top:12px}
.opt h4{margin:0 0 6px;font-size:14px;color:var(--muted);font-weight:600}

  {id:"basic",label:"인사·기본",sub:"Basics",s:[

   S("어떻게 지내세요?","How are you doing?","대답: I'm good, thanks. And you?"),
   S("잘 지내요, 고마워요","I'm good, thanks.","fine보다 good·great가 더 자연스러움"),
   S("감사합니다","Thank you so much.","so much를 붙이면 더 따뜻하게"),
   S("정말 고마워요, 큰 도움이 됐어요","Thanks a lot. That really helps.","도움받았을 때 한 문장 더 붙이기"),
   S("천만에요","You're welcome.","가볍게 No problem. / Sure. 도 씀"),
   S("실례합니다 (부를 때)","Excuse me.","길 물을 때·지나갈 때 모두 이 한마디로"),
   S("죄송합니다","I'm sorry.","부딪혔을 때는 Sorry! 한 단어로 충분"),
   S("괜찮아요","That's okay. / No worries.","사과를 받을 때"),
   S("네, 부탁해요","Yes, please.","권할 때 대답. please를 꼭 붙이기"),
   S("아니요, 괜찮습니다","No, thank you.","거절할 때 thank you를 붙이면 부드러움"),
   S("잠깐만요","Just a moment, please.","Just a second. 도 같은 뜻"),
   S("다시 한번 말해 주시겠어요?","Could you say that again?","못 알아들었을 때 가장 많이 쓰는 문장"),
   S("천천히 말해 주세요","Could you speak more slowly, please?","more slowly = 더 천천히"),
   S("영어를 잘 못해요","My English is not very good.","미리 말하면 상대가 천천히 말해 줌"),
   S("이해했어요","I got it. / I see.","I see. 는 '아 그렇군요'"),
   S("잘 모르겠어요","I'm not sure.","I don't know보다 부드러움"),
   S("이걸 영어로 뭐라고 해요?","How do you say this in English?","물건을 가리키며"),
   S("좋은 하루 보내세요","Have a nice day!","대답: You too!"),
   S("안녕히 계세요","Goodbye. / See you.","가볍게 Bye! / Take care."),
   S("또 만나요","See you later.","다시 볼 사람에게"),
   S("조심히 가세요","Take care.","헤어질 때 따뜻한 인사")]},
  {id:"pcan",label:"패턴 Can I ~?",sub:"~해도 될까요?",s:[

   S("영수증 받을 수 있을까요?","Can I get a receipt?","get = have와 같은 뜻으로 많이 씀"),

   S("좀 더 정중하게: 사진 찍어도 될까요?","May I take a picture?","May I ~ = Can I ~의 공손한 표현"),

  {id:"zp23",label:"패턴 如果…就…",sub:"만약 ~하면 ~해요",grp:"pat",s:[S("비가 오면 안 갈게요.","如果下雨，我就不去。","rúguǒ xià yǔ, wǒ jiù bú qù · 루궈 샤 위, 워 지우 부 취 · 如果 + 조건, 就 + 결과 = 만약 ~하면 ~해요"),S("시간 있으면 놀러 오세요.","如果有时间，就来玩儿吧。","rúguǒ yǒu shíjiān, jiù lái wánr ba · 루궈 여우 스지엔, 지우 라이 왈 바 · 玩儿 = 놀다"),S("몸이 안 좋으면 쉬세요.","如果不舒服，就休息吧。","rúguǒ bù shūfu, jiù xiūxi ba · 루궈 뿌 수푸, 지우 시우시 바 · 不舒服 = 몸이 안 좋다"),S("싸면 살게요.","如果便宜，我就买。","rúguǒ piányi, wǒ jiù mǎi · 루궈 피엔이, 워 지우 마이 · 便宜 = 싸다"),S("늦으면 전화 줘요.","如果晚了，就给我打电话。","rúguǒ wǎn le, jiù gěi wǒ dǎ diànhuà · 루궈 완 러, 지우 게이 워 다 띠엔화 · 给我 = 나에게"),S("피곤하면 먼저 자요.","如果累了，就先睡吧。","rúguǒ lèi le, jiù xiān shuì ba · 루궈 레이 러, 지우 시엔 쉐이 바 · 先 = 먼저"),S("마음에 들면 사세요.","如果喜欢，就买吧。","rúguǒ xǐhuan, jiù mǎi ba · 루궈 시환, 지우 마이 바 · 喜欢 = 마음에 들다"),S("모르면 저한테 물어보세요.","如果不懂，就问我。","rúguǒ bù dǒng, jiù wèn wǒ · 루궈 뿌 둥, 지우 원 워 · 懂 = 이해하다"),S("내일 날씨 좋으면 등산 가요.","如果明天天气好，我们就去爬山。","rúguǒ míngtiān tiānqì hǎo, wǒmen jiù qù pá shān · 루궈 밍티엔 티엔치 하오, 워먼 지우 취 파 산 · 爬山 = 등산하다"),S("열이 나면 병원에 가세요.","如果发烧，就去医院。","rúguǒ fāshāo, jiù qù yīyuàn · 루궈 파샤오, 지우 취 이위엔 · 发烧 = 열나다"),S("필요하면 말씀하세요.","如果需要，就告诉我。","rúguǒ xūyào, jiù gàosu wǒ · 루궈 쉬야오, 지우 까오쑤 워 · 告诉 = 알려 주다"),S("시간이 빠듯하면 택시 타요.","要是来不及，就打车。","yàoshi láibují, jiù dǎ chē · 야오스 라이부지, 지우 다 처 · 要是 = 如果 (회화체)"),S("배고프면 먼저 드세요.","要是饿了，你就先吃。","yàoshi è le, nǐ jiù xiān chī · 야오스 어 러, 니 지우 시엔 츠 · 饿 = 배고프다"),S("너무 비싸면 사지 마요.","如果太贵，就别买了。","rúguǒ tài guì, jiù bié mǎi le · 루궈 타이 꿰이, 지우 비에 마이 러 · 别 = ~하지 마"),S("길을 잃으면 저한테 전화하세요.","要是迷路了，就打给我。","yàoshi mílù le, jiù dǎ gěi wǒ · 야오스 미루 러, 지우 다 게이 워 · 迷路 = 길을 잃다"),S("저라면 안 사요.","如果是我，我就不买。","rúguǒ shì wǒ, wǒ jiù bù mǎi · 루궈 스 워, 워 지우 뿌 마이 · 如果是我 = 나라면"),S("추우면 창문 닫아요.","如果冷，就关上窗户。","rúguǒ lěng, jiù guānshang chuānghu · 루궈 렁, 지우 꽌샹 촹후 · 窗户 = 창문"),S("시간 없으면 다음에 해요.","如果没时间，就下次吧。","rúguǒ méi shíjiān, jiù xià cì ba · 루궈 메이 스지엔, 지우 샤 츠 바 · 下次 = 다음번"),S("괜찮으시면 같이 드세요.","如果不介意，一起吃吧。","rúguǒ bú jièyì, yìqǐ chī ba · 루궈 부 지에이, 이치 츠 바 · 介意 = 개의하다"),S("약 먹으면 나을 거예요.","吃了药就会好的。","chī le yào jiù huì hǎo de · 츠 러 야오 지우 후이 하오 더 · 如果는   {id:"zp24",label:"패턴 还是~？, 或者",sub:"A예요 B예요?, A나 B",grp:"pat",s:[S("커피 드실래요, 차 드실래요?","你喝咖啡还是喝茶？","nǐ hē kāfēi háishi hē chá · 니 허 카페이 하이스 허 차 · A 还是 B? = A예요 B예요? (질문), 평서문의 '또는'은 或者"),S("오늘 가요, 내일 가요?","今天去还是明天去？","jīntiān qù háishi míngtiān qù · 진티엔 취 하이스 밍티엔 취 · 还是 = 아니면"),S("여기서 드세요, 가져가세요?","在这儿吃还是带走？","zài zhèr chī háishi dài zǒu · 짜이 쩔 츠 하이스 따이 저우 · 带走 = 가져가다"),S("현금이에요, 카드예요?","现金还是刷卡？","xiànjīn háishi shuā kǎ · 시엔진 하이스 솨 카 · 现金 = 현금"),S("뜨거운 거요, 차가운 거요?","要热的还是冰的？","yào rè de háishi bīng de · 야오 러 더 하이스 삥 더 · 热的 = 뜨거운 것"),S("아들이에요, 딸이에요?","是男孩还是女孩？","shì nánhái háishi nǚhái · 스 난하이 하이스 뉘하이 · 男孩 = 남자아이"),S("지하철 탈까요, 택시 탈까요?","坐地铁还是打车？","zuò dìtiě háishi dǎ chē · 쭈어 띠티에 하이스 다 처 · 坐 = 타다"),S("창가 쪽이요, 통로 쪽이요?","靠窗还是靠过道？","kào chuāng háishi kào guòdào · 카오 촹 하이스 카오 꿔따오 · 过道 = 통로"),S("큰 거요, 작은 거요?","大的还是小的？","dà de háishi xiǎo de · 따 더 하이스 샤오 더 · 的 = ~것"),S("밥이요, 국수요?","米饭还是面条？","mǐfàn háishi miàntiáo · 미판 하이스 미엔티아오 · 面条 = 국수"),S("혼자 오셨어요, 가족이랑 오셨어요?","你一个人来还是跟家人来？","nǐ yí ge rén lái háishi gēn jiārén lái · 니 이 거 런 라이 하이스 껀 지아런 라이 · 家人 = 가족"),S("그래도 집이 제일 좋아요.","还是家里最好。","háishi jiā lǐ zuì hǎo · 하이스 지아 리 쭈에이 하오 · 还是 = 역시, 그래도"),S("역시 택시 타는 게 낫겠어요.","还是打车吧。","háishi dǎ chē ba · 하이스 다 처 바 · 还是~吧 = 역시 ~하는 게 낫겠다"),S("우리 그냥 내일 가요.","我们还是明天去吧。","wǒmen háishi míngtiān qù ba · 워먼 하이스 밍티엔 취 바 · 그냥, 역시"),S("병원에 가 보시는 게 좋겠어요.","你还是去看医生吧。","nǐ háishi qù kàn yīshēng ba · 니 하이스 취 칸 이셩 바 · 看医生 = 진찰받다"),S("오늘이나 내일 가요.","今天或者明天去。","jīntiān huòzhě míngtiān qù · 진티엔 훠저 밍티엔 취 · 或者 = 또는 (평서문)"),S("차나 커피 다 좋아요.","茶或者咖啡都可以。","chá huòzhě kāfēi dōu kěyǐ · 차 훠저 카페이 떠우 커이 · 都可以 = 다 괜찮다"),S("버스나 지하철 타면 돼요.","坐公交或者地铁都行。","zuò gōngjiāo huòzhě dìtiě dōu xíng · 쭈어 꿍쟈오 훠저 띠티에 떠우 싱 · 行 = 돼요"),S("저나 제 남편에게 연락하세요.","联系我或者我丈夫。","liánxì wǒ huòzhě wǒ zhàngfu · 리엔시 워 훠저 워 짱푸 · 丈夫 = 남편"),S("주말엔 등산이나 낚시를 가요.","周末去爬山或者钓鱼。","zhōumò qù pá shān huòzhě diào yú · 쩌우모 취 파 산 훠저 띠아오 위 · 钓鱼 = 낚시하다"),S("짠 거요, 싱거운 거요?","咸的还是淡的？","xián de háishi dàn de · 시엔 더 하이스 딴 더 · 淡 = 싱겁다"),S("편도요, 왕복이요?","单程还是往返？","dānchéng   {id:"zp25",label:"패턴 把~",sub:"~을 (어떻게) 해요",grp:"pat",s:[S("문 좀 닫아 주세요.","请把门关上。","qǐng bǎ mén guānshang · 칭 바 먼 꽌샹 · 把 + 목적어 + 동사 = ~을 ~해요 (처리 결과 강조)"),S("여권을 저한테 주세요.","请把护照给我。","qǐng bǎ hùzhào gěi wǒ · 칭 바 후짜오 게이 워 · 给我 = 저에게 주다"),S("휴대폰을 잃어버렸어요.","我把手机丢了。","wǒ bǎ shǒujī diū le · 워 바 셔우지 띠우 러 · 丢 = 잃어버리다"),S("창문 열어요.","把窗户打开吧。","bǎ chuānghu dǎkāi ba · 바 촹후 다카이 바 · 打开 = 열다"),S("짐은 여기 두세요.","把行李放这儿吧。","bǎ xíngli fàng zhèr ba · 바 싱리 팡 쩔 바 · 放 = 두다"),S("밥 다 먹었어요.","我把饭吃完了。","wǒ bǎ fàn chī wán le · 워 바 판 츠 완 러 · 吃完 = 다 먹다"),S("불 꺼요.","把灯关了吧。","bǎ dēng guān le ba · 바 떵 꽌 러 바 · 灯 = 등, 불"),S("에어컨 켜 주세요.","把空调打开。","bǎ kōngtiáo dǎkāi · 바 쿵티아오 다카이 · 空调 = 에어컨"),S("약 먹는 걸 깜빡했어요.","我把吃药的事忘了。","wǒ bǎ chī yào de shì wàng le · 워 바 츠 야오 더 스 왕 러 · 忘 = 잊다"),S("이걸 한국으로 부쳐 주세요.","把这个寄到韩国。","bǎ zhège jì dào Hánguó · 바 쩌거 지 따오 한궈 · 寄到 = ~로 부치다"),S("주소를 적어 주세요.","请把地址写下来。","qǐng bǎ dìzhǐ xiě xialai · 칭 바 띠즈 시에 샤라이 · 写下来 = 적어 두다"),S("돈은 저한테 주세요.","把钱给我吧。","bǎ qián gěi wǒ ba · 바 치엔 게이 워 바 · 钱 = 돈"),S("우산 챙겨 가세요.","把雨伞带上。","bǎ yǔsǎn dài shang · 바 위싼 따이 샹 · 雨伞 = 우산"),S("방을 깨끗이 청소했어요.","我把房间打扫干净了。","wǒ bǎ fángjiān dǎsǎo gānjìng le · 워 바 팡지엔 다싸오 깐징 러 · 打扫 = 청소하다"),S("옷 갈아입어요.","把衣服换了吧。","bǎ yīfu huàn le ba · 바 이푸 환 러 바 · 换 = 바꾸다"),S("소리 좀 줄여 주세요.","把声音关小一点。","bǎ shēngyīn guān xiǎo yìdiǎn · 바 셩인 꽌 샤오 이디엔 · 声音 = 소리"),S("신발 벗어 주세요.","请把鞋脱了。","qǐng bǎ xié tuō le · 칭 바 시에 퉈 러 · 鞋 = 신발"),S("지갑을 집에 두고 왔어요.","我把钱包忘在家里了。","wǒ bǎ qiánbāo wàng zài jiā lǐ le · 워 바 치엔빠오 왕 짜이 지아 리 러 · 忘在 = ~에 두고 오다"),S("사진 저한테 보내 줘요.","把照片发给我。","bǎ zhàopiàn fā gěi wǒ · 바 짜오피엔 파 게이 워 · 发 = 보내다"),S("이거 좀 데워 주실 수 있어요?","能把这个热一下吗？","néng bǎ zhège rè yíxià ma · 넝 바 쩌거 러 이샤 마 · 热 = 데우다"),S("물을 다 마셨어요.","我把水喝完了。","wǒ bǎ shuǐ hē wán le · 워 바 쉐이 허 완 러 · 喝完 = 다 마시다"),S("표 잘 챙기세요.","把票拿好。","bǎ piào ná hǎo · 바 피아오 나 하오 · 拿好 = 잘 들고 있다"),S("숙제 다 했니?","你把作业做完了吗？","nǐ bǎ zuòyè zuò wán le ma · 니 바 쭈어예 쭈어 완 러 마 · 作业 = 숙제"),S("고기를 작게 잘라 주세요.","把肉切小一点。","bǎ ròu qiē xiǎo yìdiǎn · 바 러우 치에 샤오 이디엔 · 切 = 자르다")]},
  {id:"zp26",label:"패턴 让~, 给~",sub:"~하게 하다, ~에게 ~해 주다",grp:"pat",s:[S("엄마가 일찍 들어오래요.","妈妈让我早点回家。","māma ràng wǒ zǎo diǎn huí jiā · 마마 랑 워 짜오 디엔 후이 지아 · A + 让 + B + 동사 = A가 B에게 ~하게 하다, 给 + 사람 + 동사 = ~에게 ~해 주다"),S("제가 좀 볼게요.","让我看看。","ràng wǒ kànkan · 랑 워 칸칸 · 让我~ = 제가 ~할게요"),S("생각 좀 해 볼게요.","让我想想。","ràng wǒ xiǎngxiang · 랑 워 샹샹 · 想想 = 생각해 보다"),S("오래 기다리셨습니다.","让您久等了。","ràng nín jiǔ děng le · 랑 닌 지우 덩 러 · 久等 = 오래 기다리다"),S("의사가 푹 쉬래요.","医生让我多休息。","yīshēng ràng wǒ duō xiūxi · 이셩 랑 워 뚜어 시우시 · 多休息 = 많이 쉬다"),S("걱정 끼쳐서 미안해요.","让你担心了。","ràng nǐ dānxīn le · 랑 니 딴신 러 · 担心 = 걱정하다"),S("이 소식 들으니 정말 기뻐요.","这个消息让我很高兴。","zhège xiāoxi ràng wǒ hěn gāoxìng · 쩌거 샤오시 랑 워 헌 까오싱 · 消息 = 소식"),S("좀 비켜 주세요.","让一下。","ràng yíxià · 랑 이샤 · 让 = 비키다"),S("아들한테 마중 나오라고 했어요.","我让儿子来接我。","wǒ ràng érzi lái jiē wǒ · 워 랑 얼즈 라이 지에 워 · 接 = 마중하다"),S("엄마한테 전화해요.","给妈妈打电话。","gěi māma dǎ diànhuà · 게이 마마 다 띠엔화 · 给 + 사람 = ~에게"),S("사진 보여 드릴게요.","我给你看照片。","wǒ gěi nǐ kàn zhàopiàn · 워 게이 니 칸 짜오피엔 · 照片 = 사진"),S("손녀에게 선물을 사 줬어요.","我给孙女买了礼物。","wǒ gěi sūnnǚ mǎi le lǐwù · 워 게이 쑨뉘 마이 러 리우 · 礼物 = 선물"),S("길 좀 알려 주세요.","请给我指个路。","qǐng gěi wǒ zhǐ ge lù · 칭 게이 워 즈 거 루 · 指路 = 길을 알려 주다"),S("문자 보낼게요.","我给你发短信。","wǒ gěi nǐ fā duǎnxìn · 워 게이 니 파 돤신 · 短信 = 문자"),S("저 좀 보여 주세요.","给我看一下。","gěi wǒ kàn yíxià · 게이 워 칸 이샤 · 看一下 = 좀 보다"),S("물 한 잔 주세요.","给我一杯水。","gěi wǒ yì bēi shuǐ · 게이 워 이 뻬이 쉐이 · 给 + 사람 + 물건 = ~에게 ~을 주다"),S("남편이 밥을 해 줬어요.","我丈夫给我做饭了。","wǒ zhàngfu gěi wǒ zuò fàn le · 워 짱푸 게이 워 쭈어 판 러 · 丈夫 = 남편"),S("아이한테 TV를 못 보게 해요.","我不让孩子看电视。","wǒ bú ràng háizi kàn diànshì · 워 부 랑 하이즈 칸 띠엔스 · 不让 = 못 하게 하다"),S("의사가 술을 못 마시게 해요.","医生不让我喝酒。","yīshēng bú ràng wǒ hē jiǔ · 이셩 부 랑 워 허 지우 · 喝酒 = 술 마시다"),S("제가 소개해 드릴게요.","我给你介绍一下。","wǒ gěi nǐ jièshào yíxià · 워 게이 니 지에샤오 이샤 · 介绍 = 소개하다"),S("할머니께 편지를 써요.","给奶奶写信。","gěi nǎinai xiě xìn · 게이 나이나이 시에 신 · 信 = 편지"),S("계산서 주세요.","给我账单。","gěi wǒ zhàngdān · 게이 워 짱딴 · 账单 = 계산서"),S("제가 할게요, 맡겨 주세요.","让我来吧。","ràng wǒ lái ba · 랑 워 라이 바 · 让我来 = 제가 할게요"),S("사장님이 좀 기다리래요.","老板让我等一下。","lǎobǎn ràng wǒ děng yíxià · 라오반 랑   {id:"vp30",label:"패턴 Sắp ~ rồi",sub:"곧 ~해요",grp:"pat",s:[S("곧 도착해요.","Sắp đến rồi.","쌉 덴 조이 · sắp + 동사 + rồi = 곧 ~해요"),S("곧 비가 올 거예요.","Trời sắp mưa rồi.","쩌이 쌉 므어 조이 · 날씨"),S("차가 곧 출발해요.","Xe sắp chạy rồi.","쌔 쌉 짜이 조이 · chạy 출발하다·달리다"),S("밥 곧 다 돼요.","Cơm sắp chín rồi.","껌 쌉 찐 조이 · 가족"),S("곧 끝나요.","Sắp xong rồi.","쌉 쏭 조이 · 조금만 기다려요"),S("가게가 곧 문 닫아요.","Cửa hàng sắp đóng cửa rồi.","끄어 항 쌉 동 끄어 조이 · cửa hàng 가게"),S("곧 설날이에요.","Sắp Tết rồi.","쌉 뗏 조이 · Tết 베트남 설"),S("곧 한국에 돌아가요.","Tôi sắp về Hàn Quốc rồi.","또이 쌉 베 한 꾸옥 조이 · 귀국"),S("곧 할머니가 돼요.","Tôi sắp làm bà rồi.","또이 쌉 람 바 조이 · làm bà 할머니가 되다"),S("딸이 곧 결혼해요.","Con gái tôi sắp cưới rồi.","꼰 가이 또이 쌉 끄어이 조이 · 가족 소식"),S("곧 비행기 타요.","Tôi sắp lên máy bay rồi.","또이 쌉 렌 마이 바이 조이 · lên 타다"),S("휴대폰 배터리가 곧 다 돼요.","Điện thoại sắp hết pin rồi.","디엔 토아이 쌉 헷 삔 조이 · hết pin 배터리 없음"),S("곧 어두워져요.","Trời sắp tối rồi.","쩌이 쌉 또이 조이 · tối 어둡다"),S("남편이 곧 은퇴해요.","Chồng tôi sắp nghỉ hưu rồi.","쫑 또이 쌉 응이 흐우 조이 · nghỉ hưu 은퇴"),S("곧 여름이에요.","Sắp đến mùa hè rồi.","쌉 덴 무어 해 조이 · mùa hè 여름"),S("손주가 곧 학교에 들어가요.","Cháu tôi sắp đi học rồi.","짜우 또이 쌉 디 혹 조이 · đi học 학교 가다"),S("곧 내려요.","Sắp xuống xe rồi.","쌉 쑤옹 쌔 조이 · 버스 안에서"),S("돈이 곧 떨어져요.","Tôi sắp hết tiền rồi.","또이 쌉 헷 띠엔 조이 · hết 다 떨어지다"),S("곧 엄마 생신이에요.","Sắp đến sinh nhật mẹ rồi.","쌉 덴 씽 녓 매 조이 · sinh nhật 생일"),S("곧 가요, 거의 다 왔어요.","Tôi sắp đến rồi đây.","또이 쌉 덴 조이 더이 · 끝의 đây 강조"),S("거의 다 나았어요.","Tôi sắp khỏi rồi.","또이 쌉 코이 조이 · khỏi 낫다"),S("약이 곧 떨어져요.","Thuốc sắp hết rồi.","투옥 쌉 헷 조이 · 처방"),S("곧 12시예요.","Sắp mười hai giờ rồi.","쌉 므어이 하이 저 조이 · 시간"),S("곧 만나요.","Sắp gặp nhau rồi.","쌉 갑 냐우 조이 · 재회 기대")]},

 {id:"w17",label:"단어 형용사 2",sub:"Adjectives 2",grp:"word",s:[S("불편한","uncomfortable","These shoes are uncomfortable. 신발이 불편해요"),S("붐비는","crowded","The subway is crowded. 지하철이 붐벼요"),S("시끄러운","noisy","It's too noisy here. 여기 너무 시끄러워요"),S("편리한","convenient","It's very convenient. 아주 편리해요"),S("불편한, 번거로운","inconvenient","It's inconvenient. 번거로워요"),S("아름다운","beautiful","What a beautiful view! 경치가 아름다워요"),S("유명한","famous","It's a famous place. 유명한 곳이에요"),S("인기 있는","popular","This is very popular. 이건 인기가 많아요"),S("흥미로운","interesting","That's interesting. 흥미롭네요"),S("지루한","boring","The movie was boring. 영화가 지루했어요"),S("신나는","exciting","The game was exciting. 경기가 신났어요"),S("멋진, 훌륭한","wonderful","We had a wonderful time. 멋진 시간이었어요"),S("끔찍한","terrible","The traffic is terrible. 교통이 끔찍해요"),S("이상한","strange","That's strange. 이상하네요"),S("특별한","special","Today is a special day. 오늘은 특별한 날이에요"),S("간단한","simple","It's simple. 간단해요"),S("유용한","useful","This app is useful. 이 앱은 유용해요"),S("튼튼한, 강한","strong","The coffee is strong. 커피가 진해요"),S("약한","weak","My legs are weak. 다리에 힘이 없어요"),S("밝은","bright","The room is bright. 방이 밝아요"),S("어두운","dark","It's dark outside. 밖이 어두워요"),S("부드러운","soft","The bread is soft. 빵이 부드러워요"),S("딱딱한, 힘든","hard","The bed is hard. 침대가 딱딱해요"),S("귀여운","cute","Your grandson is cute. 손주가 귀여워요"),S("졸린","sleepy","I'm sleepy. 졸려요"),S("운이 좋은","lucky","You're lucky. 운이 좋으시네요"),S("분명한, 맑은","clear","The sky is clear. 하늘이 맑아요"),S("완벽한","perfect","It's perfect. 완벽해요"),S("이용 가능한","available","Is this seat available? 이 자리 비었어요?"),S("아주 좋은","great","That's great! 아주 좋아요!"),S("괜찮은","fine","I'm fine, thanks. 괜찮아요, 고마워요"),S("진짜의","real","Is this real leather? 이거 진짜 가죽이에요?"),S("가짜의","fake","Be careful of fake bags. 가짜 가방을 조심하세요"),S("가능한","possible","Is it possible to change my seat? 좌석을 바꿀 수 있을까요?"),S("불가능한","impossible","It's impossible to get a ticket now. 지금은 표를 구하기가 불가능해요"),S("필요한","necessary","Is a visa necessary? 비자가 필요한가요?"),S("맞는, 정확한","correct","Is this the correct address? 이게 맞는  {id:"w18",label:"단어 부사·연결어",sub:"Adverbs & Connectors",grp:"word",s:[S("항상","always","I always walk to work. 항상 걸어서 출근해요"),S("보통","usually","I usually eat at home. 보통 집에서 먹어요"),S("자주","often","I often go hiking. 자주 등산 가요"),S("가끔","sometimes","I sometimes cook. 가끔 요리해요"),S("절대 ~않다","never","I never smoke. 담배는 절대 안 피워요"),S("이미, 벌써","already","I already ate. 벌써 먹었어요"),S("아직도, 여전히","still","It's still raining. 아직 비가 와요"),S("아직(부정문)","yet","He's not here yet. 그는 아직 안 왔어요"),S("또한","also","I also like tea. 저는 차도 좋아해요"),S("~도, 너무","too","Me too. 저도요"),S("그러나","but","It's good, but expensive. 좋지만 비싸요"),S("왜냐하면","because","I'm late because of rain. 비 때문에 늦었어요"),S("그래서","so","I was tired, so I slept. 피곤해서 잤어요"),S("만약 ~라면","if","Call me if you're free. 시간 되면 전화해요"),S("그러면, 그때","then","See you then. 그때 봐요"),S("아마도","maybe","Maybe tomorrow. 아마 내일요"),S("아마 (꽤 확실히)","probably","It'll probably rain. 아마 비가 올 거예요"),S("사실은","actually","Actually, I'm not sure. 사실 잘 모르겠어요"),S("정말","really","It's really good. 정말 좋아요"),S("거의","almost","I'm almost there. 거의 다 왔어요"),S("충분히","enough","That's enough. 그거면 충분해요"),S("매우","very","Thank you very much. 정말 감사합니다"),S("단지, 방금","just","I just arrived. 방금 도착했어요"),S("오직, ~만","only","Only one, please. 하나만 주세요"),S("다시","again","Say that again, please. 다시 말해 주세요"),S("나중에","later","Talk to you later. 나중에 얘기해요"),S("여기","here","Come here, please. 여기로 오세요"),S("거기","there","I'll be there soon. 곧 거기 갈게요"),S("함께","together","Let's go together. 같이 가요"),S("혼자","alone","I live alone. 혼자 살아요"),S("빨리","quickly","Please come quickly. 빨리 와 주세요"),S("천천히","slowly","Please speak slowly. 천천히 말해 주세요"),S("물론","of course","Of course you can. 물론 되죠"),S("그리고","and","Coffee and cake, please. 커피와 케이크 주세요"),S("또는","or","Tea or coffee? 차 아니면 커피?"),S("하지만, 그러나","however","However, it's closed. 하지만 문을 닫았어요"),S("~전에","before","Wash before eating. 먹기 전에 씻으세요"),S("~후에","after","Let's meet after lunch. 점심 후에 만나요"),S("~하는 동안","while","I read while I wait. 기다리며 책 읽어요"),S("~까지","until","Wait /* ── 설정(이 기기) + 즐겨찾기(내 전용 저장소 + 이 기기) ── */
const LSK="myapps-talk-v1";
const DEF={view:"play",lang:"ja",cat:"basic",idx:0,order:"kt",repeat:"all",rate:0.9,gap:2,vKo:"",vT:{},online:true};
let cfg={...DEF};try{cfg={...DEF,...JSON.parse(localStorage.getItem(LSK+"-cfg")||"{}")}}catch(e){}
const saveCfg=()=>{try{localStorage.setItem(LSK+"-cfg",JSON.stringify(cfg))}catch(e){}};
let fav={ids:[],updatedAt:0};try{const o=JSON.parse(localStorage.getItem(LSK+"-fav")||"null");if(o&&Array.isArray(o.ids))fav=o}catch(e){}
let db=null,favRef=null,uid=null,saveMsg="이 기기에 저장됨";
function setSave(s,m){const el=$("saveState");el.dataset.s=s;saveMsg=m||(s==="ok"?"내 전용 저장소에 저장됨":"이 기기에 저장됨");el.title=saveMsg;el.setAttribute("aria-label","저장 상태: "+saveMsg);const t=$("saveTxt");if(t)t.textContent=saveMsg}
function saveFav(){fav.updatedAt=Date.now();try{localStorage.setItem(LSK+"-fav",JSON.stringify(fav))}catch(e){}if(favRef)favRef.set(JSON.parse(JSON.stringify(fav))).then(()=>setSave("ok")).catch(()=>setSave("local","저장소에 쓰지 못해 이 기기에만 저장됨"))}
async function connect(){
  if(!window.claude||!window.claude.use){setSave("local","이 휴대폰에만 저장됨");return}
  try{db=await window.claude.use("db");const u=await window.claude.use("user");uid=u&&await u.id()}catch(e){}
  if(!db||!uid){setSave("local");return}
  favRef=db.doc("data/users/"+uid+"/talkFav");setSave("ok");
  try{const s=await favRef.get();const r=s.exists&&s.data();if(r&&Array.isArray(r.ids)){if((r.updatedAt||0)>(fav.updatedAt||0)){fav=r;try{localStorage.setItem(LSK+"-fav",JSON.stringify(fav))}catch(e){}render()}else if((fav.updatedAt||0)>(r.updatedAt||0))saveFav()}else if(fav.ids.length)saveFav()}catch(e){setSave("local","불러오지 못했습니다 · 이 기기 기록으로 표시")}
  loadPref();
}
const isFav=id=>fav.ids.includes(id);
function toggleFav(id){fav.ids=isFav(id)?fav.ids.filter(x=>x!==id):[...fav.ids,id];saveFav();render();toast(isFav(id)?"즐겨찾기에 넣었습니다":"즐겨찾기에서 뺐습니다")}

/* ── 현재 목록 ── */
const L=()=>LANGS[cfg.lang]&&!LANGS[cfg.lang].soon?LANGS[cfg.lang]:LANGS.ja;
function curList(){const lg=L();if(cfg.cat==="fav"){const all=lg.cats.flatMap(c=>c.s);return all.filter(x=>isFav(x.id))}const c=lg.cats.find(c=>c.id===cfg.cat)||lg.cats[0];return c.s}
function catLabel(){if(cfg.cat==="fav")return "즐겨찾기";const c=L().cats.find(c=>c.id===cfg.cat);return c?c.label:""}
function cur(){const l=curList();if(!l.length)return null;if(cfg.idx>=l.length)cfg.idx=0;return l[cfg.idx]}

/* ── 음성: 기기 음성(기본) → 안 되면 온라인 음성 ── */
let voices=[];
function loadVoices(){try{voices=window.speechSynthesis?speechSynthesis.getVoices():[]}catch(e){voices=[]}}
loadVoices();try{if(window.speechSynthesis)speechSynthesis.onvoiceschanged=()=>{loadVoices();if(cfg.view==="set")render()}}catch(e){}
const pref=(list,keys)=>list.find(v=>keys.some(k=>v.name.includes(k)))||list.find(v=>v.localService)||list[0]||null;
function pickVoice(lang){const code=lang==="ko"?"ko":L().voice.slice(0,2);const list=voices.filter(v=>(v.lang||"").toLowerCase().replace("_","-").startsWith(code));
  const want=lang==="ko"?cfg.vKo:(cfg.vT||{})[cfg.lang];const w=want&&list.find(v=>v.name===want);if(w)return w;
  return pref(list,lang==="ko"?["Google","Yuna","유나","Heami"]:["Google","Kyoko","O-ren","Haruka","Nanami"])}
function sysSpeak(lang,text,rate,tok){return new Promise((ok,no)=>{
  if(!window.speechSynthesis){no(new Error("nosynth"));return}
  const v=pickVoice(lang);if(!v&&voices.length){no(new Error("novoice"));return}
  try{speechSynthesis.cancel()}catch(e){}
  const u=new SpeechSynthesisUtterance(text);u.lang=lang==="ko"?"ko-KR":L().voice;if(v)u.voice=v;u.rate=rate;
  let done=false;const fin=e=>{if(done)return;done=true;clearTimeout(wd);e?no(e):ok()};
  /* 일부 휴대폰은 끝 신호가 오지 않아 멈추는 문제가 있어 시간으로 한 번 더 확인 */
  const wd=setTimeout(()=>fin(),Math.max(3500,text.length*(lang==="ko"?260:330)/rate)+2500);
  u.onend=()=>fin();u.onerror=e=>fin(e&&e.error==="interrupted"||e&&e.error==="canceled"?null:new Error(e&&e.error||"err"));
  speechSynthesis.speak(u);
  if(tok!==gen){fin()}
})}
let au=null;
function netSpeak(lang,text,rate){return new Promise((ok,no)=>{
  const tl=lang==="ko"?"ko":L().tl;if(!au){au=new Audio();au.setAttribute("playsinline","")}
  au.onended=()=>ok();au.onerror=()=>no(new Error("net"));au.playbackRate=rate;
  au.src=`https://translate.googleapis.com/translate_tts?ie=UTF-8&client=gtx&tl=${tl}&q=${encodeURIComponent(text)}`;
  au.play().catch(no)})}
async function speak(lang,text,tok){
  text=String(text).replace(/\s*\/\s*/g,", ");
  try{await sysSpeak(lang,text,cfg.rate,tok)}
  catch(e){if(tok!==gen)return;if(!cfg.online)throw e;await netSpeak(lang,text,cfg.rate)}}

/* ── 화면 꺼짐 방지: Wake Lock + (안 되면) 무음 영상 재생 ── */
let wl=null,awakeMode="";
async function keepAwake(){
  if(!playing)return;
  if("wakeLock" in navigator){try{if(!wl){wl=await navigator.wakeLock.request("screen");wl.addEventListener("release",()=>{wl=null;if(playing&&document.visibilityState==="visible")setTimeout(keepAwake,300);showAwake()})}awakeMode="wl"}catch(e){wl=null}}
  const v=$("ksv");try{v.muted=true;await v.play();if(!wl)awakeMode="video"}catch(e){if(!wl)awakeMode="none"}
  showAwake()}
function releaseAwake(){try{if(wl)wl.release()}catch(e){}wl=null;try{$("ksv").pause()}catch(e){}awakeMode="";showAwake()}
function awakeTxt(){return !playing?"재생하면 화면이 켜진 채로 유지됩니다":awakeMode==="wl"?"화면 켜짐 유지 중":awakeMode==="video"?"화면 켜짐 유지 중 (보조 방식)":awakeMode==="none"?"이 화면에서는 화면 유지가 안 됩니다 · 설정 탭 안내 참고":"화면 켜짐 준비 중"}
function showAwake(){const e=$("awake");if(e){e.className="awake"+(playing&&awakeMode&&awakeMode!=="none"?" on":"");e.textContent=awakeTxt()}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&playing){wl=null;keepAwake()}});
setInterval(()=>{if(playing&&awakeMode!=="wl")keepAwake()},15000);

/* ── 재생 ── */
let playing=false,gen=0,phase="";
function setPhase(p,msg){phase=p;document.querySelectorAll("[data-ln]").forEach(e=>e.classList.toggle("speak",e.dataset.ln===(p.startsWith("t")?"t":p)));
  document.querySelectorAll(".reps i").forEach((e,i)=>e.classList.toggle("on",p==="t"+(i+1)));
  const st=$("stTxt");if(st&&msg!=null)st.textContent=msg;const d=$("stDot");if(d)d.classList.toggle("on",playing)}
function media(x){try{if(!("mediaSession" in navigator)||!x)return;navigator.mediaSession.metadata=new MediaMetadata({title:x.t,artist:x.ko,album:`MY 회화 · ${L().name} · ${catLabel()}`});navigator.mediaSession.playbackState=playing?"playing":"paused"}catch(e){}}
async function loop(){
  const tok=++gen;
  while(playing&&tok===gen){
    const l=curList(),x=cur();if(!x){stop();toast("재생할 문장이 없습니다");return}
    media(x);
    try{
      if(cfg.order==="kt"||cfg.order==="k"){setPhase("k",`한국어: ${x.ko}`);await speak("ko",x.ko,tok);if(tok!==gen)return;if(cfg.order==="kt"){setPhase("",null);await sleep(600)}}
      if(cfg.order!=="k"){for(let i=1;i<=2;i++){if(tok!==gen)return;setPhase("t"+i,`${L().name} ${i}/2: ${x.t}`);await speak("t",x.t,tok);if(tok!==gen)return;if(i===1){setPhase("",null);await sleep(500)}}}
    }catch(e){if(tok!==gen)return;stop();setPhase("","소리를 내지 못했습니다 · 설정 탭에서 음성을 확인해 주세요");return}
    if(tok!==gen)return;setPhase("",`다음 문장까지 ${cfg.gap}초`);
    await sleep(cfg.gap*1000);if(tok!==gen||!playing)return;
    if(cfg.repeat==="all")cfg.idx=(cfg.idx+1)%l.length;else if(cfg.repeat==="shuffle"&&l.length>1){let n;do{n=Math.floor(Math.random()*l.length)}while(n===cfg.idx);cfg.idx=n}
    saveCfg();renderCard();
  }}
function start(){if(playing)return;playing=true;keepAwake();try{if(window.speechSynthesis){speechSynthesis.cancel();speechSynthesis.resume()}}catch(e){}renderCard();loop()}
function stop(){playing=false;gen++;try{speechSynthesis.cancel()}catch(e){}try{if(au)au.pause()}catch(e){}releaseAwake();setPhase("","멈춤");renderCard();try{navigator.mediaSession.playbackState="paused"}catch(e){}}
function jump(d){const l=curList();if(!l.length)return;cfg.idx=(cfg.idx+d+l.length)%l.length;saveCfg();restart()}
function restart(){if(playing){gen++;try{speechSynthesis.cancel()}catch(e){}try{if(au)au.pause()}catch(e){}renderCard();loop()}else render()}
try{if("mediaSession" in navigator){navigator.mediaSession.setActionHandler("play",start);navigator.mediaSession.setActionHandler("pause",stop);navigator.mediaSession.setActionHandler("nexttrack",()=>jump(1));navigator.mediaSession.setActionHandler("previoustrack",()=>jump(-1))}}catch(e){}

  $("tbPill").textContent=L().name;$("tList").textContent=`즐겨찾기 ${fav.ids.length}`;
  ({play:renderPlay,list:renderList,set:renderSet})[cfg.view]();
}
function langChips(){return `<div class="langs" role="group" aria-label="언어">${Object.entries(LANGS).map(([k,v])=>`<button class="chip" type="button" ${v.soon?"disabled":""} data-lang="${k}" aria-pressed="${cfg.lang===k}">${v.name}${v.soon?"<small>준비 중</small>":""}</button>`).join("")}</div>`}
/* 상황·패턴·단어 묶음: 영어처럼 상황이 많을 때 위에서 먼저 고름 */
const GRP=[["sit","상황"],["pat","패턴"],["word","단어"]];
const grpOf=c=>c.grp||(/^w\d\d$/.test(c.id)?"word":(/^p/.test(c.id)&&c.id!=="phone"?"pat":"sit"));
function catChips(){const lg=L();const gs=GRP.filter(g=>lg.cats.some(c=>grpOf(c)===g[0]));const curC=lg.cats.find(c=>c.id===cfg.cat);const cg=curC?grpOf(curC):(cfg.grpSel||gs[0][0]);
  const seg=gs.length>1?`<div class="grp" role="group" aria-label="묶음">${gs.map(g=>{const cs=lg.cats.filter(c=>grpOf(c)===g[0]);return `<button type="button" data-grp="${g[0]}" aria-pressed="${cg===g[0]&&cfg.cat!=="fav"}">${g[1]}<small>${cs.length}개 · ${cs.reduce((a,c)=>a+c.s.length,0)}</small></button>`}).join("")}</div>`:"";
  return seg+`<div class="chips" role="group" aria-label="상황">${lg.cats.filter(c=>gs.length<2||grpOf(c)===cg).map(c=>`<button class="chip" type="button" data-cat="${c.id}" aria-pressed="${cfg.cat===c.id}">${esc(c.label.replace(/^(패턴|단어) /,""))}</button>`).join("")}<button class="chip" type="button" data-cat="fav" aria-pressed="${cfg.cat==="fav"}">즐겨찾기 ${fav.ids.length}</button></div>`}
function seg(name,arr,val){return `<div class="seg full" role="group">${arr.map(a=>{const [k,l,s]=Array.isArray(a)?a:[a,a];return `<button type="button" data-${name}="${k}" aria-pressed="${String(k)===String(val)}">${esc(l)}${s?`<br><small style="font-size:12px;opacity:.75">${esc(s)}</small>`:""}</button>`}).join("")}</div>`}
function renderPlay(){
  const lg=L();let h="";
  h+=langChips()+catChips();
  h+=`<section class="player" id="card"></section>`;
  h+=`<section class="box"><div class="opt" style="margin-top:0"><h4>재생 순서</h4>${seg("order",ORDERS,cfg.order)}</div>
    <div class="opt"><h4>반복</h4>${seg("repeat",REPEATS,cfg.repeat)}</div>
    <div class="opt"><h4>말 빠르기</h4>${seg("rate",RATES.map(r=>[r,r.toFixed(1)+"배"]),cfg.rate)}</div>
    <div class="opt"><h4>다음 문장까지</h4>${seg("gap",GAPS.map(g=>[g,g+"초"]),cfg.gap)}</div></section>`;
  const l=curList();
  h+=`<div class="tl-h"><h3>${esc(catLabel())} ${l.length}문장</h3><span>누르면 그 문장부터</span></div>`;
  h+=l.length?`<ul class="slist">${l.map((x,i)=>sRow(x,i)).join("")}</ul>`:`<div class="empty">즐겨찾기한 문장이 없습니다.<br>문장 옆 ★을 누르면 여기에 모입니다.</div>`;
  $("vPlay").innerHTML=h;renderCard();
}
function sRow(x,i,go){return `<li class="srow ${!go&&i===cfg.idx?"on":""}"><span class="no">${i+1}</span><button class="bd" type="button" ${go?`data-go="${x.id}"`:`data-idx="${i}"`}><b>${esc(x.ko)}</b><span lang="${cfg.lang}">${esc(x.t)} · ${esc(x.r)}</span></button><button class="star" type="button" data-fav="${x.id}" aria-pressed="${isFav(x.id)}" aria-label="즐겨찾기">${isFav(x.id)?"★":"☆"}</button></li>`}
function renderCard(){
  const c=$("card");if(!c)return;const l=curList(),x=cur();
  if(!x){c.innerHTML=`<p class="meta2">재생할 문장이 없습니다.</p>`;return}
  const n=l.length,prog=n<=30?`<div class="prog">${l.map((_,i)=>`<i class="${i===cfg.idx?"on":i<cfg.idx?"done":""}"></i>`).join("")}</div>`:"";
  c.innerHTML=`${prog}<div class="pmeta"><span>${esc(catLabel())} · ${cfg.idx+1} / ${n}</span><button class="star" type="button" data-fav="${x.id}" aria-pressed="${isFav(x.id)}" aria-label="즐겨찾기">${isFav(x.id)?"★":"☆"}</button></div>
    <div class="ln ko" data-ln="k"><div class="lb"><span>한국어</span></div><div class="tx">${esc(x.ko)}</div></div>
    <div class="ln tg" data-ln="t"><div class="lb"><span>${L().name} · 2번</span></div><div class="tx" lang="${cfg.lang}">${esc(x.t)}</div><div class="rd">${esc(x.r)}</div><div class="reps"><i></i><i></i></div></div>
    <div class="status"><span class="dot ${playing?"on":""}" id="stDot"></span><span id="stTxt">${playing?"재생 중":"재생을 누르면 시작합니다"}</span></div>
    <div class="ctl"><button class="btn" type="button" data-step="-1">이전</button><button class="btn play ${playing?"stop":""}" type="button" id="playBtn">${playing?"■ 정지":"▶ 재생"}</button><button class="btn" type="button" data-step="1">다음</button></div>
    <div style="margin-top:10px;text-align:center"><span id="awake" class="awake"></span></div>`;
  showAwake();
  document.querySelectorAll("#vPlay .srow").forEach((r,i)=>r.classList.toggle("on",i===cfg.idx));
}
function renderList(){
  const lg=L();const all=lg.cats.flatMap(c=>c.s.map(x=>({...x,cat:c})));const fs=all.filter(x=>isFav(x.id));
  let h=`<div class="dayhead"><h2>문장 모아 보기</h2><div class="meta">${lg.name} ${all.length}문장 · 즐겨찾기 ${fs.length}</div></div>`;
  h+=`<section class="box"><h3>즐겨찾기 (${fs.length})</h3>${fs.length?`<ul class="slist">${fs.map((x,i)=>sRow(x,i,1)).join("")}</ul><button class="btn pri" type="button" data-cat="fav" data-goplay="1" style="width:100%;min-height:46px;margin-top:10px">즐겨찾기만 반복 듣기</button>`:`<p class="meta2">자주 쓸 문장의 ☆을 누르면 여기에 모입니다.</p>`}</section>`;
  lg.cats.forEach(c=>{h+=`<details class="box" style="padding:0 14px"><summary style="min-height:48px;display:flex;align-items:center;justify-content:space-between;font-weight:600;cursor:pointer">${esc(c.label)} <span class="meta2">${c.s.length}문장</span></summary><ul class="slist" style="margin-bottom:12px">${c.s.map((x,i)=>sRow(x,i,1)).join("")}</ul></details>`});
  $("vList").innerHTML=h;
}
function vOpts(lang){const code=lang==="ko"?"ko":L().voice.slice(0,2);const list=voices.filter(v=>(v.lang||"").toLowerCase().replace("_","-").startsWith(code));const p=pickVoice(lang);
  return list.length?`<select data-voice="${lang}">${list.map(v=>`<option value="${esc(v.name)}" ${p&&p.name===v.name?"selected":""}>${esc(v.name)}</option>`).join("")}</select>`:`<p class="meta2">이 기기에 ${lang==="ko"?"한국어":L().name} 음성이 없습니다.${cfg.online?" 온라인 음성으로 재생합니다.":""}</p>`}
function renderSet(){
  let h=`<div class="dayhead"><h2>설정</h2><div class="meta">음성 · 화면 유지 · 백업</div></div>`;
  h+=`<section class="box"><h3>음성</h3><div class="vstack"><label class="fld">${L().name} 음성${vOpts("t")}</label><label class="fld">한국어 음성${vOpts("ko")}</label>
    <div class="frow"><button class="btn line" type="button" data-test="t">${L().name} 들어 보기</button><button class="btn line" type="button" data-test="ko">한국어 들어 보기</button></div>
    <label class="ck" style="display:flex;gap:8px;align-items:center;min-height:44px"><input type="checkbox" id="onlineCk" ${cfg.online?"checked":""} style="width:22px;height:22px">기기 음성이 안 나오면 온라인 음성 사용</label></div></section>`;
  h+=`<section class="box"><h3>화면 꺼짐 방지</h3><p>재생 중에는 화면이 자동으로 꺼지지 않게 붙잡아 둡니다. 정지하면 원래대로 돌아갑니다.</p>
    <ol class="ol" style="margin-top:8px"><li><b>홈 화면에 설치한 앱(설치판)</b>에서 가장 잘 됩니다. MY 미니앱 허브의 'MY 회화'를 홈 화면에 추가해 쓰세요.</li>
    <li>그래도 꺼지면 휴대폰 <b>설정 → 디스플레이 → 화면 자동 꺼짐</b>을 10분으로 늘려 주세요.</li>
    <li>절전 모드에서는 화면 유지가 막힐 수 있습니다.</li></ol>
    <p class="meta2" style="margin-top:8px">지금 이 화면: ${"wakeLock" in navigator?"화면 유지 기능 지원":"보조 방식으로 화면 유지"}</p></section>`;
  h+=`<section class="box"><h3>저장·백업</h3><div class="row"><span class="l">저장 상태</span><span class="r" id="saveTxt" style="white-space:normal">${esc(saveMsg)}</span></div>
    <div class="row"><span class="l">즐겨찾기</span><span class="r">${fav.ids.length}문장</span></div>
    <div class="frow" style="margin-top:10px"><button class="btn pri" type="button" id="bkSave" style="flex:1">백업 파일 저장</button><label class="btn pick" style="flex:1">파일에서 복원<input type="file" id="bkFile" accept="application/json,.json"></label></div></section>`;
  h+=`<p class="meta2" style="margin-top:12px">영어·중국어·베트남어는 같은 방식으로 준비 중입니다.</p>`;
  $("vSet").innerHTML=h;
}
function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>{t.hidden=true},2400)}

/* ── 백업 ── */
async function saveFile(){const data=JSON.stringify({app:"MY 회화",v:1,exportedAt:new Date().toISOString(),fav},null,1);const d=new Date();const name=`MY미니앱_회화_백업_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}.json`;
  let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null}catch(e){}
  try{if(dl){await dl.save({filename:name,data:new Blob([data],{type:"application/json"})})}else{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),3000)}toast("백업 파일을 저장했습니다")}catch(e){if(!e||e.code!=="declined")toast("저장하지 못했습니다")}}
function restore(txt){let o;try{o=JSON.parse(txt)}catch(e){toast("백업 파일을 읽지 못했습니다");return}if(!o||o.app!=="MY 회화"||!o.fav){toast("MY 회화 백업이 아닙니다");return}
  const before=fav.ids.length;fav.ids=[...new Set([...fav.ids,...(o.fav.ids||[])])];saveFav();render();toast(`즐겨찾기 ${fav.ids.length-before}개를 더했습니다`)}

/* ── 이벤트 ── */
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;const d=t.dataset;
  if(d.view){cfg.view=d.view;saveCfg();render();window.scrollTo({top:0});return}
  if(t.id==="playBtn"){playing?stop():start();return}
  if(d.step){jump(+d.step);return}
  if(d.fav){toggleFav(d.fav);return}
  if(d.grp){const c=L().cats.find(c=>grpOf(c)===d.grp);if(c&&cfg.cat!==c.id){cfg.cat=c.id;cfg.idx=0;cfg.grpSel=d.grp;saveCfg();if(playing){render();restart()}else render()}return}
  if(d.cat){if(cfg.cat!==d.cat){cfg.cat=d.cat;cfg.idx=0}if(d.goplay)cfg.view="play";saveCfg();if(playing){render();restart()}else render();return}
  if(d.idx!=null){cfg.idx=+d.idx;saveCfg();if(playing){renderCard();restart()}else{renderCard();start()}return}
  if(d.go){const lg=L();for(const c of lg.cats){const i=c.s.findIndex(x=>x.id===d.go);if(i>=0){cfg.cat=c.id;cfg.idx=i;break}}cfg.view="play";saveCfg();stop();render();window.scrollTo({top:0});start();return}
  if(d.lang){if(LANGS[d.lang].soon)return;cfg.lang=d.lang;cfg.cat=L().cats[0].id;cfg.idx=0;saveCfg();stop();render();return}
  if(d.order){cfg.order=d.order;saveCfg();render();if(playing)restart();return}
  if(d.repeat){cfg.repeat=d.repeat;saveCfg();render();return}
  if(d.rate){cfg.rate=+d.rate;saveCfg();render();return}
  if(d.gap){cfg.gap=+d.gap;saveCfg();render();return}
  if(d.test){const x=cur();if(x){const was=playing;if(was)stop();gen++;const tk=gen;speak(d.test==="ko"?"ko":"t",d.test==="ko"?x.ko:x.t,tk).catch(()=>toast("소리를 내지 못했습니다"))}return}
  if(t.id==="bkSave"){saveFile();return}
});
document.addEventListener("change",e=>{const t=e.target;
  if(t.dataset.voice){if(t.dataset.voice==="ko")cfg.vKo=t.value;else{cfg.vT={...(cfg.vT||{}),[cfg.lang]:t.value}}saveCfg();toast("음성을 바꿨습니다");return}
  if(t.id==="onlineCk"){cfg.online=t.checked;saveCfg();return}
  if(t.id==="bkFile"&&t.files[0]){t.files[0].text().then(restore);t.value="";return}
});
$("sheetBg").addEventListener("click",e=>{if(e.target===$("sheetBg"))$("sheetBg").hidden=true});
const PWA=/github\.io$/.test(location.hostname);if(PWA)$("homeBtn").hidden=false;

/* ── 글자 크기 (기기 + 내 설정) ── */
const FS=["s","m","l","xl"];let fs="m",prefRef=null;
try{const v=localStorage.getItem("myapps-fs");if(FS.includes(v))fs=v}catch(e){}
function applyFs(){document.documentElement.dataset.fs=fs;document.querySelectorAll("#fontPop [data-fs]").forEach(b=>b.setAttribute("aria-checked",String(b.dataset.fs===fs)));try{localStorage.setItem("myapps-fs",fs)}catch(e){}}
async function loadPref(){try{if(!uid||!db)return;prefRef=db.doc("data/users/"+uid+"/prefs");const s=await prefRef.get();const v=s.exists&&s.data().fs;if(v&&FS.includes(v)&&v!==fs){fs=v;applyFs()}}catch(e){}}
$("fontBtn").addEventListener("click",e=>{e.stopPropagation();const p=$("fontPop");p.hidden=!p.hidden;$("fontBtn").setAttribute("aria-expanded",String(!p.hidden))});
$("fontPop").addEventListener("click",e=>{const b=e.target.closest("[data-fs]");if(!b)return;e.stopPropagation();fs=b.dataset.fs;applyFs();if(prefRef)prefRef.set({fs,updatedAt:Date.now()}).catch(()=>{});$("fontPop").hidden=true;toast("글자 크기: "+b.querySelector("span").textContent)});
document.addEventListener("click",e=>{if(!$("fontPop").hidden&&!e.target.closest("#fontPop"))$("fontPop").hidden=true});

if(!["play","list","set"].includes(cfg.view))cfg.view="play";
applyFs();render();connect();
window.__talk={state:()=>({playing,phase,awakeMode,idx:cfg.idx,gen})};
})();
</script>
<script>if("serviceWorker" in navigator&&location.protocol==="https:"&&/github\.io$/.test(location.hostname))addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))</script></body></html>
